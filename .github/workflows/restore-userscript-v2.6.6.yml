name: Restore userscript v2.5.5 behavior

on:
  push:
    paths:
      - rollback-v2.5.5-userscript.json
      - .github/workflows/restore-userscript-v2.6.6.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore release config and manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          release = json.loads(Path('rollback-v2.5.5-userscript.json').read_text(encoding='utf-8'))
          Path('release-userscript.json').write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')
          parts = release['parts']
          data = b''.join(Path(p).read_bytes() for p in parts)
          Path('/tmp/userscript-v2.6.6.js').write_bytes(data)

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw = 'https://raw.githubusercontent.com/bomboclaat12369/novelai-media-library/main/'
          manifest['userscript_payload_version'] = str(release['version'])
          manifest['userscript_parts'] = [raw + p for p in parts]
          manifest['userscript_sha256'] = hashlib.sha256(data).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate userscript syntax
        run: node --check /tmp/userscript-v2.6.6.js
      - name: Commit restored userscript release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-userscript.json manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore userscript v2.5.5 behavior as v2.6.6"
          git push
