name: Apply userscript v2.7.7

on:
  push:
    paths:
      - tools/write-userscript-v2.7.7.py
      - .github/workflows/apply-userscript-v2.7.7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write userscript patch
        run: python tools/write-userscript-v2.7.7.py
      - name: Validate patch syntax
        run: |
          cp payload/userscript-2.7.7.patch01.txt /tmp/userscript-v2.7.7.js
          node --check /tmp/userscript-v2.7.7.js
      - name: Validate complete userscript syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('release-userscript.json').read_text())
          parts=[]
          for p in cfg['parts']:
              if p in {'payload/userscript-2.5.2.patch01.txt','payload/userscript-2.5.3.patch01.txt'}:
                  continue
              if p=='payload/userscript-2.7.6.patch01.txt':
                  p='payload/userscript-2.7.7.patch01.txt'
              parts.append(p)
          out='\n'.join(Path(p).read_text(encoding='utf-8') for p in parts)
          Path('/tmp/complete-userscript-v2.7.7.js').write_text(out,encoding='utf-8')
          PY
          node --check /tmp/complete-userscript-v2.7.7.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/userscript-2.7.7.patch01.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore fast import path and add timing diagnostics"
          git push
