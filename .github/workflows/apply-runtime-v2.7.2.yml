name: Apply runtime v2.7.2 import jobs

on:
  push:
    paths:
      - tools/apply-runtime-v2.7.2.py
      - .github/workflows/apply-runtime-v2.7.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply runtime patch
        run: python tools/apply-runtime-v2.7.2.py
      - name: Validate runtime syntax
        run: python -m py_compile runtime-src/companion-runtime.pyw
      - name: Commit runtime source
        run: |
          if git diff --quiet -- runtime-src/companion-runtime.pyw; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-src/companion-runtime.pyw
          git commit -m "Make media imports asynchronous and status-tracked"
          git push
