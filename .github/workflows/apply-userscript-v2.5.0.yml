name: Apply userscript v2.5.0 release

on:
  push:
    paths:
      - tools/write-userscript-v2.5.0.py
      - .github/workflows/apply-userscript-v2.5.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Write v2.5.0 patch and release config
        run: python tools/write-userscript-v2.5.0.py
      - name: Validate userscript patch syntax
        run: |
          cp payload/userscript-2.5.0.patch01.txt /tmp/userscript-2.5.0.patch01.js
          node --check /tmp/userscript-2.5.0.patch01.js
      - name: Commit v2.5.0 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/userscript-2.5.0.patch01.txt release-userscript.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Release userscript v2.5.0"
          git push
