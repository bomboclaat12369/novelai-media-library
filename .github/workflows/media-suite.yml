name: Windows Media Suite
on:
  pull_request:
    paths: ['media-suite/**', '.github/workflows/media-suite.yml']
  push:
    branches: [main]
    paths: ['media-suite/**', '.github/workflows/media-suite.yml']
permissions:
  contents: read
concurrency:
  group: windows-media-suite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: game-build-20261109
          path: game-qa-source
          sparse-checkout: |
            game
            runtime-src
            assets
            payload
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Windows program and test its service connections
        shell: pwsh
        run: |
          python -m pip install -r duplicate-review/requirements.txt playwright==1.58.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python media-suite/make-icon.py
          dotnet run --project media-suite/tests/core/CoreChecks.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python media-suite/tests/companion-updates.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build media-suite/tests/browser/BrowserSmoke.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish media-suite/MediaSuite.csproj -c Release -r win-x64 --self-contained true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python media-suite/package.py
      - name: Test automatic updates, two Edge profiles and the four real modes
        shell: pwsh
        run: |
          $archive = (Get-Item media-suite/artifacts/Media-Suite-*.zip).FullName
          $older = Join-Path $env:RUNNER_TEMP 'Older suite launcher'
          $staged = Join-Path $env:RUNNER_TEMP 'Suite update fixture'
          dotnet build media-suite/MediaSuite.csproj -c Debug -p:Version=1.0.99 -o $older
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project media-suite/tests/updates/UpdateChecks.csproj -c Release -- $archive $staged
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & media-suite/tests/check-install.ps1 $archive -OlderLauncher (Join-Path $older 'MediaSuite.exe') -StagedUpdate $staged
          $fixture = Join-Path $env:RUNNER_TEMP 'Suite integration fixture'
          python media-suite/tests/fixture.py $fixture game-qa-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python media-suite/tests/edge-smoke.py $fixture media-suite/tests/browser/bin/Release/net8.0-windows/MediaSuite.BrowserSmoke.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python media-suite/tests/check-result.py $fixture
      - name: Check the release pipeline with disposable Git repositories
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: python -m unittest discover -s tests -p test_release_pipeline.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: windows-media-suite
          path: media-suite/artifacts/*
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-media-suite
          path: release
      - name: Publish a versioned installer and verify the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="media-suite-v$(jq -r .version release/media-suite-manifest.json)"
          zip=$(jq -r .file release/media-suite-manifest.json)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D existing
            cmp "release/$zip" "existing/$zip"
            cmp release/Install-Media-Suite.cmd existing/Install-Media-Suite.cmd
          else
            gh release create "$tag" "release/$zip" release/Install-Media-Suite.cmd release/media-suite-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Windows Media Suite ${tag#media-suite-v}" --notes "Media Suite checks for app updates automatically. Open Mode → Updates to see the Windows suite, Media Library and Battles, Workbench, and After Hours in one place. Verified updates wait for a safe session change. Standalone apps keep their update controls."
          fi
          jq --arg commit "$GITHUB_SHA" --arg tag "$tag" '. + {status:"published_verification_pending",commit:$commit,tag:$tag}' release/media-suite-manifest.json > release-receipt.json
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D verified
          cmp release/media-suite-manifest.json verified/media-suite-manifest.json
          cd verified
          echo "$(jq -r .sha256 media-suite-manifest.json)  $zip" | sha256sum -c -
          echo "$(jq -r .installer_sha256 media-suite-manifest.json)  Install-Media-Suite.cmd" | sha256sum -c -
          # The auto-update feed is a separate, small file on main. Promote only
          # after the public versioned package and downloader have both verified.
          channel=release-media-suite.json
          api="repos/$GITHUB_REPOSITORY"
          sha=$(gh api "$api/git/trees/main" --jq '.tree[] | select(.path=="release-media-suite.json") | .sha')
          if [[ -n "$sha" ]]; then
            gh api -H 'Accept: application/vnd.github.raw+json' "$api/contents/$channel?ref=main" > ../previous-feed.json
            previous=$(jq -er .version ../previous-feed.json)
            version=$(jq -er .version media-suite-manifest.json)
            [[ $(printf '%s\n' "$previous" "$version" | sort -V | tail -1) == "$version" ]]
            if [[ "$previous" == "$version" ]]; then cmp ../previous-feed.json media-suite-manifest.json; fi
          fi
          if ! cmp -s ../previous-feed.json media-suite-manifest.json; then
            jq -n --rawfile body media-suite-manifest.json --arg sha "$sha" --arg tag "$tag" '{message:("Promote verified " + $tag),branch:"main",content:($body|@base64)} + (if $sha!="" then {sha:$sha} else {} end)' > ../feed-request.json
            gh api --method PUT "$api/contents/$channel" --input ../feed-request.json > /dev/null
          fi
          gh api -H 'Accept: application/vnd.github.raw+json' "$api/contents/$channel?ref=main" > ../api-feed.json
          cmp media-suite-manifest.json ../api-feed.json
          for attempt in {1..32}; do
            if curl -fsSL --max-time 10 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/$channel" -o ../raw-feed.json && cmp -s media-suite-manifest.json ../raw-feed.json; then break; fi
            sleep 12
          done
          cmp media-suite-manifest.json ../raw-feed.json
          jq --arg commit "$GITHUB_SHA" --arg tag "$tag" --arg feed "$channel" '. + {status:"published_verified",commit:$commit,tag:$tag,feed:$feed}' media-suite-manifest.json > ../release-receipt.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('release-receipt.json') != ''
        with:
          name: windows-suite-release-receipt
          path: release-receipt.json
