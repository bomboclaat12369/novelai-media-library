name: Apply runtime v2.7.6

on:
  push:
    paths:
      - tools/apply-runtime-v2.7.6.py
      - .github/workflows/apply-runtime-v2.7.6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply runtime diagnostics patch
        run: python tools/apply-runtime-v2.7.6.py
      - name: Validate runtime syntax
        run: python -m py_compile runtime-src/companion-runtime.pyw
      - name: Commit runtime source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-src/companion-runtime.pyw
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add detailed local import and disk diagnostics"
          git push
