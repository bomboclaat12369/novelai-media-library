name: Apply runtime v2.6.0 persistent crops fixed

on:
  push:
    paths:
      - .github/workflows/apply-runtime-v2.6.0-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: |
          python tools/apply_runtime_v260.py
          python -m py_compile runtime-src/companion-runtime.pyw
      - name: Commit runtime source and release config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-src/companion-runtime.pyw release-runtime.json
          git commit -m "Add persistent cropped image derivatives" || exit 0
          git push
