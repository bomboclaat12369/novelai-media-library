name: Restore runtime v2.5.0 behavior

on:
  push:
    paths:
      - .github/workflows/restore-runtime-v2.6.4.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore exact v2.5.0 runtime source
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = ''
          for i in range(1, 8):
              p = Path('payload') / f'runtime-2.5.0.part{i:02d}.b64'
              encoded += p.read_text(encoding='utf-8').strip()
          source = base64.b64decode(encoded, validate=True)
          out = Path('runtime-src/companion-runtime.pyw')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(source)
          PY
      - name: Validate restored runtime
        run: python -m py_compile runtime-src/companion-runtime.pyw
      - name: Commit restored runtime source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-src/companion-runtime.pyw
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore v2.5.0 runtime behavior"
          git push
