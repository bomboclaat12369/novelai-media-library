name: Release userscript v2.5.3

on:
  push:
    paths:
      - .github/workflows/release-userscript-v2.5.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update userscript release config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('release-userscript.json')
          data = json.loads(p.read_text())
          part = 'payload/userscript-2.5.3.patch01.txt'
          if part not in data['parts']:
              data['parts'].append(part)
          data['version'] = '2.5.3'
          data['release_build'] = max(int(data.get('release_build', 0)) + 1, 31)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit release config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-userscript.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release userscript v2.5.3"
          git push
