name: Build companion runtime release

on:
  push:
    paths:
      - release-runtime.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build runtime payload and manifest
        run: |
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          release = json.loads(Path('release-runtime.json').read_text(encoding='utf-8'))
          version = str(release['version'])
          source_path = Path(release.get('source', 'runtime-src/companion-runtime.pyw'))
          payload = source_path.read_bytes()
          encoded = base64.b64encode(payload).decode('ascii')
          chunk_size = 10000
          out_paths = []
          for i in range(0, len(encoded), chunk_size):
              p = Path(f'payload/runtime-{version}.part{i // chunk_size + 1:02d}.b64')
              p.write_text(encoded[i:i+chunk_size], encoding='ascii')
              out_paths.append(p)

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw = 'https://raw.githubusercontent.com/bomboclaat12369/novelai-media-library/main/'
          manifest['runtime_version'] = version
          manifest['runtime_encoding'] = 'base64'
          manifest['runtime_sha256'] = hashlib.sha256(payload).hexdigest()
          manifest['runtime_parts'] = [raw + p.as_posix() for p in out_paths]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate runtime syntax
        run: python -m py_compile runtime-src/companion-runtime.pyw
      - name: Commit runtime release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json payload/runtime-*.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish companion runtime release"
          git push
