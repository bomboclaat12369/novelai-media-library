name: Staged Library evolution editor in Edge
on:
  push:
    branches: [codex/library-evolution-windows-qa]
permissions:
  contents: read
jobs:
  editor:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the staged Library and exercise the real Windows browser
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.58.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/evolution-test" jsdom@26.1.0 --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NODE_PATH = "$env:RUNNER_TEMP/evolution-test/node_modules"
          python tools/build-standalone.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/evolution_editor_fixture.py "$env:RUNNER_TEMP/evolution-library"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/staged_evolution_edge.py "$env:RUNNER_TEMP/evolution-library"
