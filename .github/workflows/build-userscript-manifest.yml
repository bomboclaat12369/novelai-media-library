name: Validate userscript source

on:
  push:
    branches: [main]
    paths: ['release-userscript.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt -r duplicate-review/requirements.txt
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/nai-dom-test" jsdom@26.1.0 @napi-rs/canvas@0.1.80 --no-audit --no-fund
      - name: Validate current product sources
        env:
          NODE_PATH: ${{ runner.temp }}/nai-dom-test/node_modules
        run: python tools/check-product.py
      - name: Publication route
        run: echo 'Publication uses the authorized .github/release-request.json and Build and publish from source workflow.'
