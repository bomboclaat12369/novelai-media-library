<body><noscript>Enable JavaScript to use the media library.</noscript><script>// Native companion transport for the local browser tab. No extension bridge.
(() => {
  'use strict';
  document.documentElement.dataset.naiStandalone = '1';
  window.GM_xmlhttpRequest = options => {
    const url = new URL(options.url, location.href);
    if (!['127.0.0.1','localhost'].includes(url.hostname) || url.port !== '8765' || !url.pathname.startsWith('/api/')) {
      queueMicrotask(() => options.onerror?.({status:0,error:'Only local companion requests are supported.'}));
      return {abort(){}};
    }
    const xhr = new XMLHttpRequest();
    xhr.open(options.method || 'GET', url.pathname + url.search, true);
    xhr.timeout = options.timeout || 0;
    if (options.responseType && options.responseType !== 'text') xhr.responseType = options.responseType;
    for (const [key,value] of Object.entries(options.headers || {})) {
      if (!/^(origin|host|referer|content-length|cookie)$/i.test(key)) xhr.setRequestHeader(key,value);
    }
    const response = event => ({
      status:xhr.status, statusText:xhr.statusText,
      response:xhr.response,
      responseText:!xhr.responseType || xhr.responseType === 'text' ? xhr.responseText : '',
      responseHeaders:xhr.getAllResponseHeaders(), finalUrl:xhr.responseURL,
      loaded:event?.loaded || 0, total:event?.total || 0, lengthComputable:!!event?.lengthComputable,
    });
    for (const name of ['load','error','timeout','abort','loadend','loadstart','progress','readystatechange']) {
      xhr.addEventListener(name,event => options['on'+name]?.(response(event)));
    }
    if(options.upload?.onprogress)xhr.upload.onprogress=options.upload.onprogress;
    xhr.send(options.data ?? null);
    return {abort:()=>xhr.abort()};
  };
})();

// NovelAI Media Library v2.8.3: bound companion traffic across all payload layers.
// The wrapper is local to this assembled payload; it never patches NovelAI's globals.
((nativeCompanionRequest) => {
  'use strict';

  function createCompanionTransport(nativeRequest) {
    const pending = [];
    const sharedReads = new Map();
    const MAX_ACTIVE = 4;
    const MAX_THUMBNAILS = 2;
    let active = 0;
    let activeThumbnails = 0;
    let generation = 0;
    let pumpQueued = false;

    function notify(subscriber, event, response) {
      if (!subscriber.live) return;
      const callback = subscriber.options[event] || (event === 'onabort' ? subscriber.options.onerror : null);
      try { callback?.(response); }
      catch (error) { console.error('[NovelAI Media] request callback failed', error); }
    }

    function schedulePump() {
      if (pumpQueued) return;
      pumpQueued = true;
      queueMicrotask(pump);
    }

    function finish(job, event, response) {
      if (job.done) return;
      job.done = true;
      if (job.key && sharedReads.get(job.key) === job) sharedReads.delete(job.key);
      if (job.started) {
        active--;
        if (job.thumbnail) activeThumbnails--;
      } else {
        const index = pending.indexOf(job);
        if (index >= 0) pending.splice(index, 1);
      }
      if (!job.thumbnail && job.started && performance.now() - job.created > 2000) {
        console.info(`[NovelAI Media timing] ${job.method} ${job.path}: queue ${Math.round(job.startedAt - job.created)} ms, request ${Math.round(performance.now() - job.startedAt)} ms (${event})`);
      }
      for (const subscriber of job.subscribers) {
        notify(subscriber, event, response);
        notify(subscriber, 'onloadend', response);
        subscriber.live = false;
      }
      schedulePump();
    }

    function pump() {
      pumpQueued = false;
      while (active < MAX_ACTIVE) {
        // Foreground saves/imports and original images bypass queued thumbnails.
        let index = pending.findIndex(job => !job.thumbnail && !job.background);
        if (index < 0 && activeThumbnails < MAX_THUMBNAILS) index = pending.findIndex(job => job.thumbnail);
        if (index < 0 && active < MAX_ACTIVE-1) index=pending.findIndex(job=>job.background);
        if (index < 0) return;
        const job = pending.splice(index, 1)[0];
        job.started = true;
        job.startedAt = performance.now();
        active++;
        if (job.thumbnail) activeThumbnails++;
        const options = {...job.options};
        delete options.naiBackground;
        for (const event of ['onload', 'onerror', 'ontimeout', 'onabort']) options[event] = response => finish(job, event, response);
        options.onloadend = () => {};
        for (const event of ['onprogress', 'onloadstart', 'onreadystatechange']) {
          options[event] = response => job.subscribers.forEach(subscriber => notify(subscriber, event, response));
        }
        try { job.handle = nativeRequest(options); }
        catch (error) { finish(job, 'onerror', {status:0, error:String(error)}); }
      }
    }

    return function request(options) {
      let url;
      try { url = new URL(options.url); } catch (_) { return nativeRequest(options); }
      if (!['127.0.0.1', 'localhost'].includes(url.hostname) || url.port !== '8765' || !url.pathname.startsWith('/api/')) {
        return nativeRequest(options);
      }
      const method = String(options.method || 'GET').toUpperCase();
      if (method === 'GET' && /\/api\/media\/[^/]+\/(original|thumb)$/.test(url.pathname)) {
        const versioned = document.getElementById('nai-media-host')?.shadowRoot?.naiVersionMediaUrl?.(url.href);
        if (versioned) { url = new URL(versioned); options = {...options, url:url.href}; }
      }
      if (method !== 'GET' && method !== 'HEAD') {
        // A read requested after a write must not reuse a pre-write snapshot.
        generation++;
        sharedReads.clear();
      }
      const thumbnail = method === 'GET' && /\/thumb$/.test(url.pathname);
      const shareable = method === 'GET' && (url.pathname === '/api/library' || thumbnail);
      const key = shareable ? JSON.stringify([generation, url.href, options.responseType || 'text', options.timeout || 0, options.headers || {}]) : null;
      let job = key ? sharedReads.get(key) : null;
      const subscriber = {options, live:true};
      if (job) job.subscribers.push(subscriber);
      else {
        job = {options, background:!!options.naiBackground, method, path:url.pathname, thumbnail, key, subscribers:[subscriber], created:performance.now(), started:false, done:false, handle:null};
        if (key) sharedReads.set(key, job);
        pending.push(job);
        schedulePump();
      }
      return {
        abort() {
          if (!subscriber.live || job.done) return;
          notify(subscriber, 'onabort', {status:0, error:'Request aborted'});
          notify(subscriber, 'onloadend', {status:0});
          subscriber.live = false;
          if (!job.subscribers.some(item => item.live)) {
            finish(job, 'onabort', {status:0});
            try { job.handle?.abort?.(); } catch (_) {}
          }
        },
      };
    };
  }

  const companionTransport = createCompanionTransport(nativeCompanionRequest);
  const visualRequests=new Set();
  const GM_xmlhttpRequest=options=>{
    if(!/\/api\/media\/[^/]+\/(thumb|original|display)(?:[?]|$)/.test(options.url||'') || (options.method||'GET')!=='GET')return companionTransport(options);
    let handle;
    handle=companionTransport({...options,onloadend:r=>{visualRequests.delete(handle);options.onloadend?.(r);}});
    visualRequests.add(handle);return handle;
  };
  GM_xmlhttpRequest.cancelVisuals=()=>{for(const handle of [...visualRequests])handle.abort();visualRequests.clear();};
// NovelAI Media Library v2.8.5: start each page with an empty single viewer
(() => {
  'use strict';
  const key = 'nai-media-v1-ui';
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '{}') || {};
    // Keep the user's character, category, and visibility preferences. The viewer
    // itself is intentionally reset on every page load.
    saved.selectedMediaId = null;
    saved.slotMediaIds = [null, null];
    saved.activeSlot = 0;
    saved.splitView = false;
    localStorage.setItem(key, JSON.stringify(saved));
  } catch (_) {}
})();

// @namespace    local.novelai.media.library

// @description  Local character image/video library for NovelAI with split-view, video bookmarks, and responsive duplicate imports.
// @match        https://novelai.net/*

(() => {
  'use strict';

  // A stale Tampermonkey copy or a second loader execution can otherwise create
  // another full Shadow DOM library over the same NovelAI page. Each copy adds
  // its own observers, image requests, and event handlers, which can stall the
  // page even though the companion itself is idle. Keep exactly one base host.
  const existingHost = document.getElementById('nai-media-host');
  if (existingHost) {
    existingHost.dataset.naiMediaDuplicateSuppressed = '1';
    console.warn('[NovelAI Media] duplicate payload suppressed; keeping the existing library host.');
    return;
  }
  document.documentElement.dataset.naiMediaPayloadInstance = '2.8.52';

  const STANDALONE = document.documentElement.dataset.naiStandalone === '1';
  const VIEWER_ONLY = !STANDALONE;
  const API = 'http://127.0.0.1:8765';
  const STATE_KEY = 'nai-media-v1-ui';
  const MAX_THUMB_BYTES = 64 * 1024 * 1024;
  const FEATURED_CHARACTER_ID = '__nai_featured__';
  const FEATURED_VIDEOS_CHARACTER_ID = '__nai_featured_videos__';
  const isFeaturedView = id => id === FEATURED_CHARACTER_ID || id === FEATURED_VIDEOS_CHARACTER_ID;

  const state = {
    library: null,
    characterId: null,
    categoryId: 'all',
    selectedMediaId: null,
    search: '',
    visible: true,
    connected: false,
    thumbCache: new Map(),
    splitView: false,
    activeSlot: 0,
    slotMediaIds: [null, null],
    slotObjectUrls: [null, null],
    reviewQueue: [],
    reviewIndex: 0,
    carryReviewCategories: false,
    carryCategories: null,
    qualityToken: 0,
    libraryLoadToken: 0,
    sortMode: 'default',
    sortDirection: 'asc',
    randomSortToken: Math.random().toString(36).slice(2),
    featuredFavoritesMode: false,
    featuredVideosMode: false,
    mediaMode: 'images',
    characterSorts: {},
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
    state.characterId = saved.characterId || null;
    state.categoryId = saved.categoryId || 'all';
    state.selectedMediaId = saved.selectedMediaId || null;
    state.splitView = !!saved.splitView;
    state.activeSlot = saved.activeSlot === 1 ? 1 : 0;
    state.slotMediaIds = Array.isArray(saved.slotMediaIds) ? [saved.slotMediaIds[0] || null, saved.slotMediaIds[1] || null] : [state.selectedMediaId, null];
    if (!state.slotMediaIds[0] && state.selectedMediaId) state.slotMediaIds[0] = state.selectedMediaId;
    state.selectedMediaId = state.slotMediaIds[state.activeSlot] || state.slotMediaIds[0] || null;
    state.visible = saved.visible !== false;
    state.sortMode = ['default','imported','main_added','pixels','bytes','random','rank_high','rank_low','rank_few'].includes(saved.sortMode) ? saved.sortMode : 'default';
    state.sortDirection = saved.sortDirection === 'desc' ? 'desc' : 'asc';
    state.mediaMode = saved.mediaMode === 'videos' || saved.categoryId === 'videos' ? 'videos' : 'images';
    state.characterSorts = saved.characterSorts && typeof saved.characterSorts === 'object' ? saved.characterSorts : {};
    if(!saved.defaultSortVersion){if(state.sortMode==='imported')state.sortMode='default';for(const pref of Object.values(state.characterSorts))if(pref.mode==='imported')pref.mode='default';}
    if (state.characterId && !isFeaturedView(state.characterId) && !state.characterSorts[state.characterId]) {
      state.characterSorts[state.characterId] = {mode:state.sortMode, direction:state.sortDirection, randomSortToken:state.randomSortToken};
    }
  } catch (_) {}

  if (STANDALONE) { state.splitView = true; state.visible = true; state.activeSlot = 0; }

  function persistUI() {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      characterId: state.characterId,
      categoryId: state.categoryId,
      selectedMediaId: state.selectedMediaId,
      splitView: state.splitView,
      activeSlot: state.activeSlot,
      slotMediaIds: state.slotMediaIds,
      visible: state.visible,
      defaultSortVersion: 1,
      sortMode: state.sortMode,
      sortDirection: state.sortDirection,
      mediaMode: state.mediaMode,
      characterSorts: state.characterSorts,
    }));
  }

  function gmRequest({ method = 'GET', path, data = null, headers = {}, responseType = 'text', timeout = 120000, naiBackground = false }) {
    return new Promise((resolve, reject) => {
      GM_xmlhttpRequest({
        method,
        url: `${API}${path}`,
        data,
        headers: { Origin: 'https://novelai.net', ...headers },
        responseType,
        timeout,
        naiBackground,
        onload: (res) => {
          if (res.status >= 200 && res.status < 300) {
            if (responseType === 'blob') return resolve(res.response);

            reject(new Error(message));
          }

        onerror: () => reject(new Error('Could not connect to the local NovelAI Media Library program.')),
        ontimeout: () => reject(new Error('The local media request timed out.')),
      });

  function formatBytes(value) {
    const bytes = Number(value);
    if (!Number.isFinite(bytes) || bytes < 0) return '';
    if (bytes < 1024) return `${Math.round(bytes)} B`;
    if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
    if (bytes < 1024 ** 3) return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
    return `${(bytes / 1024 ** 3).toFixed(2)} GB`;
  }

  async function loadMediaQuality(m) {
    const token = ++state.qualityToken;
    qualityInfo.textContent = 'Source quality: loading…';
    try {
      const key=directOriginalUrl(m.id);
      if(!qualityCache.has(key))qualityCache.set(key,gmRequest({path:`/api/media/${encodeURIComponent(m.id)}/quality`,timeout:15000}).catch(err=>{qualityCache.delete(key);throw err;}));
      const info=await qualityCache.get(key);
      while(qualityCache.size>256)qualityCache.delete(qualityCache.keys().next().value);
      if (token !== state.qualityToken || activeMedia()?.id !== m.id) return;
      const size = formatBytes(info?.file_bytes);
      const dimensions = Number(info?.width) > 0 && Number(info?.height) > 0 ? `${info.width} × ${info.height}` : '';
      const details = [dimensions, size].filter(Boolean).join(' · ');
      qualityInfo.textContent = details ? `Source quality: ${details}` : 'Source quality: unavailable';
    } catch (_) {
      if (token === state.qualityToken && activeMedia()?.id === m.id) qualityInfo.textContent = 'Source quality: unavailable';
    }
  }

  function formatTime(seconds) {
    if (seconds === null || seconds === undefined || Number.isNaN(Number(seconds))) return '—';
    const total = Math.max(0, Math.floor(Number(seconds)));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }

  function currentVideoTime() {
    const v = activeVideoElement();
    return v && Number.isFinite(v.currentTime) ? Math.max(0, v.currentTime) : 0;
  }

  async function canvasThumbnailBlob(video) {
    if (!video || !video.videoWidth || !video.videoHeight) throw new Error('Wait for the video frame to appear first.');
    const maxSide = 840;
    const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.86));
    if (!blob) throw new Error('Could not capture this video frame.');
    return blob;
  }

  // Chromium delays native picture clicks by 300ms for double-click detection.
  // Cancel that default action and toggle immediately, outside the controls band.
  const pictureClicks = new WeakMap();
  shadow.addEventListener('click', event => {
    const video = event.target;
    if (video?.tagName !== 'VIDEO' || event.button !== 0) return;
    if(STANDALONE && video._naiSelectionClick){
      video._naiSelectionClick=false;pictureClicks.set(video,video.paused);
      event.preventDefault();event.stopImmediatePropagation();return;
    }
    const rect = video.getBoundingClientRect();
    if (video.controls && event.clientY >= rect.bottom - 64) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (event.detail > 1) return;
    pictureClicks.set(video, video.paused);
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  }, true);
  shadow.addEventListener('dblclick', event => {
    const video = event.target;
    if (video?.tagName !== 'VIDEO' || event.clientY >= video.getBoundingClientRect().bottom - 64) return;
    event.preventDefault(); event.stopImmediatePropagation();
    // Restore the playback state before the first click, then toggle fullscreen.
    if (pictureClicks.get(video)) video.pause();
    else video.play().catch(() => {});
    if (document.fullscreenElement) document.exitFullscreen()?.catch(() => {});
    else video.requestFullscreen?.()?.catch(() => {});
  }, true);

  async function setVideoSourceWithFallback(video, m, slot = null) {
    video.controls = true;
    video.preload = 'metadata';
    video.playsInline = true;
    video.loop = true;
    video.volume = 0.08;
    video.src = directOriginalUrl(m.id);
    let triedFallback = false;
    video.addEventListener('error', async () => {
      if (triedFallback || !video.isConnected || shadow.naiMediaSuspended) return;
      triedFallback = true;
      try {
        const blob = await gmRequest({ path: `/api/media/${m.id}/original`, responseType: 'blob', timeout: 300000 });
        if(!video.isConnected || shadow.naiMediaSuspended)return;
        const url = URL.createObjectURL(blob);
        if (slot !== null) {
          revokeSlotUrl(slot);
          state.slotObjectUrls[slot] = url;
        } else {
          video._naiBlobUrl = url;
        }
        video.src = url;
        video.load();
      } catch (_) {}
    }, { once: true });
  }

  async function renderSlot(slot, mediaId) {
    if(shadow.naiMediaSuspended)return;
    clearTimeout(prefetchTimer);++prefetchGeneration;
    const el = stageEls[slot];
    const renderToken = (el._naiRenderToken || 0) + 1;
    el._naiRenderToken = renderToken;
    const m = mediaById(mediaId);
    const oldVideo = el.querySelector('video');
    if (oldVideo) oldVideo.pause();
    revokeSlotUrl(slot);
    el.innerHTML = '';
    trimViewer();
    if (!m) {
      el.innerHTML = `<div class="muted slotHint">${slot === 1 ? 'Click this slot, then choose any image or video — even from the same character.' : 'Choose an image or video from the library.'}</div>`;
      return;
    }
    if (m.media_type === 'video') {
      const video = document.createElement('video');
      // A click on an already-active video should only control playback. Re-running
      // setActiveSlot here rebuilt the grid and reloaded source quality on every
      // pause/play click, which caused the visible thumbnail flicker and delay.
      video.addEventListener('pointerdown', () => {
        if (state.activeSlot !== slot) setActiveSlot(slot);
      }, { passive: true });
      await setVideoSourceWithFallback(video, m, slot);
      if (el._naiRenderToken !== renderToken) return;
      el.appendChild(video);
      return;
    }
    const preview=cachedThumb(m.id);
    if(preview){
      const img=document.createElement('img');img.src=preview;img.alt=m.original_name || '';
      shadow.naiPrepareViewerImage?.(img,m);el.appendChild(img);
    }else el.innerHTML='<div class="muted">Loading…</div>';
    try {
      const asset=await viewerAsset(m);
      if(el._naiRenderToken!==renderToken)return;
      const img=document.createElement('img');img.dataset.mediaId=m.id;img.src=asset.url;img.alt=m.original_name || '';
      shadow.naiPrepareViewerImage?.(img,m);
      state.slotObjectUrls[slot]=asset.url;
      img.addEventListener('click',async e=>{e.stopPropagation();await setActiveSlot(slot);if(!STANDALONE)openLightbox();});
      el.replaceChildren(img);
      prefetchNeighbors(m.id);
    }catch(err){
      if(el._naiRenderToken===renderToken)el.innerHTML=`<div class="muted">${escapeHtml(err.message)}</div>`;
    }finally{trimViewer();}
  }

      const lib = await gmRequest({ path: '/api/library' });

        if (state.reviewIndex >= state.reviewQueue.length) return finishReview();

        if (!state.reviewQueue.length || state.reviewIndex >= state.reviewQueue.length) return finishReview();

    const keyHandler = (e) => {
      if (!modalRoot.childElementCount) return document.removeEventListener('keydown', keyHandler, true);
      if (e.target.matches('input, textarea, select')) return;
      if (e.key >= '1' && e.key <= '9' && m.media_type !== 'video') {

  }

  function finishReview() {
    modalRoot.innerHTML = '';
    state.reviewQueue = [];
    state.reviewIndex = 0;

  }

  loadLibrary(false);

(() => {

    }
  `;
  root.appendChild(style);

  function gmRequest({ method = 'GET', path, data = null, headers = {}, responseType = 'text', timeout = 300000 }) {
    return new Promise((resolve, reject) => {
      GM_xmlhttpRequest({
        method,
        url: `${API}${path}`,
        data,
        headers: { Origin: 'https://novelai.net', ...headers },
        responseType,
        timeout,
        onload: res => {
          if (res.status >= 200 && res.status < 300) {
            if (responseType === 'blob') return resolve(res.response);
            const text = res.responseText || '';
            if (!text) return resolve(null);
            try { resolve(JSON.parse(text)); } catch (_) { resolve(text); }
            return;
          }
          let message = `Request failed (${res.status})`;
          try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
          reject(new Error(message));
        },
        onerror: () => reject(new Error('Could not connect to the local NovelAI Media Library program.')),
        ontimeout: () => reject(new Error('The local media request timed out.')),
      });
    });
  }

  function activeVideo() {
    return root.querySelector('.stage.slot-active video') || root.querySelector('.stage:not(.hidden) video');
  }

  function activeMediaId() {
    return root.querySelector('.tile.active')?.dataset?.id || null;
  }

  function waitForVideoEvent(video, event, timeout = 30000) {
    return new Promise((resolve, reject) => {
      let timer;
      const cleanup = () => {
        clearTimeout(timer);
        video.removeEventListener(event, done);
        video.removeEventListener('error', failed);
      };
      const done = () => { cleanup(); resolve(); };
      const failed = () => { cleanup(); reject(new Error('Could not load the video frame for thumbnail capture.')); };
      timer = setTimeout(() => { cleanup(); reject(new Error(`Timed out waiting for video ${event}.`)); }, timeout);
      video.addEventListener(event, done, { once: true });
      video.addEventListener('error', failed, { once: true });
    });
  }

  async function captureFrameFromBlob(mediaId, seconds) {
    const sourceBlob = await gmRequest({ path: `/api/media/${mediaId}/original`, responseType: 'blob' });
    const sourceUrl = URL.createObjectURL(sourceBlob);
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    video.src = sourceUrl;
    try {
      if (video.readyState < 1) await waitForVideoEvent(video, 'loadedmetadata');
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      const target = duration > 0
        ? Math.min(Math.max(0, seconds), Math.max(0, duration - 0.01))
        : Math.max(0, seconds);
      if (Math.abs(video.currentTime - target) > 0.001) {
        video.currentTime = target;
        await waitForVideoEvent(video, 'seeked');
      } else if (video.readyState < 2) {
        await waitForVideoEvent(video, 'loadeddata');
      }
      if (!video.videoWidth || !video.videoHeight) throw new Error('Video frame is not ready yet.');
      const maxSide = 960;
      const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Could not capture this video frame.');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return await new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not create thumbnail image.')), 'image/jpeg', 0.9);
      });
    } finally {
      video.pause();
      video.removeAttribute('src');
      video.load();
      URL.revokeObjectURL(sourceUrl);
    }
  }

  root.addEventListener('click', async event => {
    const thumbButton = event.target.closest?.('#setThumbBtn');
    if (thumbButton) {
      event.preventDefault();
      event.stopImmediatePropagation();
      const video = activeVideo();
      const mediaId = activeMediaId();
      if (!video || !mediaId) return;
      thumbButton.disabled = true;
      thumbButton.textContent = 'Saving thumbnail…';
      try {
        const seconds = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        const frameBlob = await captureFrameFromBlob(mediaId, seconds);
        await gmRequest({
          method: 'POST',
          path: `/api/media/${mediaId}/thumbnail?seconds=${encodeURIComponent(seconds)}`,
          headers: { 'Content-Type': 'image/jpeg' },
          data: frameBlob,
        });
        // Clear the old thumb object URL so the existing UI reloads the newly saved frame.
        const activeTile = root.querySelector(`.tile[data-id="${mediaId}"] img[data-mid]`);
        if (activeTile) activeTile.removeAttribute('src');
        thumbButton.textContent = 'Thumbnail saved';
        const refresh = root.querySelector('#refreshBtn');
        if (refresh) refresh.click();
      } catch (err) {
        alert(err?.message || String(err));
        thumbButton.textContent = 'Set thumbnail to current frame';
      } finally {
        setTimeout(() => {
          if (thumbButton.isConnected) {
            thumbButton.disabled = false;
            if (thumbButton.textContent === 'Thumbnail saved') thumbButton.textContent = 'Set thumbnail to current frame';
          }
        }, 700);
      }
      return;
    }

    const seekButton = event.target.closest?.('[data-seek-marker]');
    if (seekButton) {
      const video = activeVideo();
      if (!video) return;
      const wasPaused = video.paused;
      if (wasPaused) {
        // Let the existing handler perform the exact saved seek, then restore the prior paused state.
        setTimeout(() => { if (video.isConnected) video.pause(); }, 0);
      }
    }
  }, true);
})();

          try { return resolve(JSON.parse(text)); } catch (_) { return resolve(text); }

  function createSetTile(set) {
    const tile = document.createElement('div');
    tile.className = 'naiSetTile';
    tile.dataset.setId = set.id;
    const published = availableSetIds(set);
    tile.dataset.coverId = published.includes(set.cover_media_id) ? set.cover_media_id : (published[0] || '');
    tile.title = `${labelOf(set)}: ${set.name} — ${counts(set)}`;

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    if (tile.dataset.coverId) {
      tile.appendChild(img);
      img.dataset.mid=tile.dataset.coverId;
      const cached=root.naiCachedThumbnail?.(tile.dataset.coverId);
      if(cached)img.src=cached;else root.naiObserveGridTile(tile);
    } else {
      const empty = document.createElement('div');
      empty.textContent = 'Empty set';
      empty.style.cssText = 'display:grid;place-items:center;height:100%;color:#a8abc4';
      tile.appendChild(empty);
    }

    tile.appendChild(favoriteButton(set));
    const source=tile.dataset.coverId!==set.cover_media_id?'auto':(set.cover_source || 'unknown');
    if(tile.dataset.coverId && source!=='manual'){
      const badge=document.createElement('span');badge.className='naiSetCoverStatus';
      badge.textContent=source==='auto'?'Auto':'?';
      badge.setAttribute('aria-label',source==='auto'?'Automatic thumbnail':'Unconfirmed thumbnail');
      badge.title=source==='auto'?'Automatically selected thumbnail. Open the set and use the pin to choose one.':'This older set has no record of how its thumbnail was chosen. Use the pin to confirm your choice.';
      tile.appendChild(badge);
    }
    const stack = document.createElement('div');
    stack.className = 'naiSetStack';
    stack.innerHTML = root.naiIconSvg('link');
    tile.appendChild(stack);

    const count = document.createElement('div');
    count.className = 'naiSetCount';
    count.textContent = counts(set);
    tile.appendChild(count);

    const caption = document.createElement('div');
    caption.className = 'naiSetCaption';
    caption.textContent = `${labelOf(set)}: ${set.name || 'Untitled'}`;
    tile.appendChild(caption);
    if(selectingSets){const check=document.createElement('input');check.type='checkbox';check.className='naiSetSelect';check.checked=chosenSets.has(set.id);check.setAttribute('aria-label',`Select Set ${set.name}`);check.onclick=e=>e.stopPropagation();check.onchange=()=>{check.checked?chosenSets.add(set.id):chosenSets.delete(set.id);renderSetsView();};tile.append(check);}


    tile.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      if(selectingSets){chosenSets.has(set.id)?chosenSets.delete(set.id):chosenSets.add(set.id);renderSetsView();}else openSet(set.id);
    });
    root.naiDecorateRanking?.(tile,set,'sets');
    return tile;
  }

  function visibleCollections() {
    const q=String(searchInput.value || '').trim().toLowerCase(),stats=new Map();
    let sets=setsForCurrentCharacter().filter(s=>{
      if(favoriteSetsOnly && !s.favorite)return false;
      if(setCategory && (setCategory==='__none' ? (s.categories||[]).length : !(s.categories||[]).includes(setCategory)))return false;
      const count=collectionStats(s);stats.set(s.id,count);
      if(videoPresence==='yes' && !count.videos || videoPresence==='no' && count.videos)return false;
      return !q || searchText(s).includes(q);
    });
    const name=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'});
    if(collectionSort==='images-desc')sets.sort((a,b)=>stats.get(b.id).images-stats.get(a.id).images || name(a,b));
    if(collectionSort==='images-asc')sets.sort((a,b)=>stats.get(a.id).images-stats.get(b.id).images || name(a,b));
    if(collectionSort==='name')sets.sort(name);
    if(collectionSort==='updated')sets.sort((a,b)=>(Date.parse(b.updated_at||b.created_at)||0)-(Date.parse(a.updated_at||a.created_at)||0)||name(a,b));
    return root.naiSortRankedSets?.(sets,collectionSort) || sets;
  }

  function renderRecentSetItems(){
    ensureControls();
    const ids=visibleSetIds(setById(RECENT_SET_ID)),head=document.createElement('div');head.className='naiSetBreadcrumb';
    head.innerHTML=`<button type="button" id="naiSetBackBtn">← Back</button><div class="naiSetTitle">Recent Set items · ${ids.length}</div><select id="naiRecentSetType" aria-label="Recent Set item type"><option value="image">Images</option><option value="video">Videos</option><option value="all">Images &amp; videos</option></select><label><input type="checkbox" id="naiRecentOutsideMain"> Only outside Main</label><div class="muted" style="flex-basis:100%">Newest Set additions first. Older items without a recorded addition date appear last.</div>`;
    head.querySelector('#naiSetBackBtn').onclick=returnToPreviousView;
    const type=head.querySelector('#naiRecentSetType');type.value=recentType;type.onchange=()=>{recentType=type.value;renderOpenSet();};
    const outside=head.querySelector('#naiRecentOutsideMain');outside.checked=recentOnlyOutsideMain;outside.onchange=()=>{recentOnlyOutsideMain=outside.checked;renderOpenSet();};
    const groups=new Map();for(const group of setsForCurrentCharacter())for(const id of group.media_ids||[]){if(!groups.has(id))groups.set(id,[]);groups.get(id).push(group);}
    const decorate=tile=>{
      tile.querySelectorAll('.naiRecentSetCaption,.naiMainBadge').forEach(el=>el.remove());
      const m=mediaById(tile.dataset.id),members=groups.get(m.id)||[],caption=document.createElement('button');
      caption.type='button';caption.className='naiRecentSetCaption';caption.textContent=members.map(s=>s.name).join(' · ');
      const stamp=Date.parse(m.set_added_at);caption.title=`${caption.textContent} · ${stamp ? 'Added '+new Date(stamp).toLocaleString() : 'Addition date not recorded'} · Open Set`;
      caption.style.cssText='position:absolute;bottom:0;left:0;right:0;width:100%;border:0;border-radius:0;background:#111c;color:#fff;padding:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3';

  async function saveSetOrder(set,ids){
    if(orderSaving||ids.every((id,index)=>id===set.media_ids[index]))return;orderSaving=true;set.media_ids=[...ids];renderOpenSet();

  let setDrop=null,dropMarker=null;
  function clearSetDrop(){draggedId=null;setDrop=null;dropMarker?.remove();dropMarker=null;}
  function locateSetDrop(x,y){
    const tiles=[...grid.querySelectorAll('.tile[data-id]')];if(!tiles.length)return null;
    let chosen=null,best=Infinity;
    for(const tile of tiles){const r=tile.getBoundingClientRect();const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom);const d=dx*dx+dy*dy;if(d<best){chosen={tile,r};best=d;}}
    const {tile,r}=chosen,ids=setById(openSetId)?.media_ids||[];
    const after=y>r.bottom?true:y<r.top?false:Math.abs(x-(r.left+r.width/2))<r.width*.1?ids.indexOf(draggedId)<ids.indexOf(tile.dataset.id):x>r.left+r.width/2;
    return {id:tile.dataset.id,after,r};
  }
  grid.addEventListener('dragover',event=>{
    if(!arranging||orderSaving||!draggedId||!openSetId||event.target.closest('.naiSetBreadcrumb'))return;
    event.preventDefault();event.stopPropagation();event.dataTransfer.dropEffect='move';
    setDrop=locateSetDrop(event.clientX,event.clientY);if(!setDrop)return;
    if(!dropMarker){dropMarker=document.createElement('div');dropMarker.style.cssText='position:fixed;width:4px;background:#b4a7ff;border-radius:3px;box-shadow:0 0 7px #8e7eff;pointer-events:none;z-index:2147484400';root.append(dropMarker);}
    const r=setDrop.r;dropMarker.style.left=(setDrop.after?r.right-2:r.left-2)+'px';dropMarker.style.top=r.top+'px';dropMarker.style.height=r.height+'px';
  });
  grid.addEventListener('dragleave',event=>{if(!grid.contains(event.relatedTarget)){setDrop=null;dropMarker?.remove();dropMarker=null;}});
  grid.addEventListener('drop',event=>{
    if(!arranging||orderSaving||!draggedId||!openSetId)return;
    event.preventDefault();event.stopPropagation();
    const target=event.target.closest('.naiSetBreadcrumb')?null:locateSetDrop(event.clientX,event.clientY),from=draggedId,set=setById(openSetId);clearSetDrop();
    if(!target||!set||from===target.id)return;
    const ids=[...set.media_ids];if(!ids.includes(from)||!ids.includes(target.id))return;
    ids.splice(ids.indexOf(from),1);ids.splice(ids.indexOf(target.id)+(target.after?1:0),0,from);saveSetOrder(set,ids);
  });

  const setCounterObserver = counter ? new MutationObserver(() => {
    if (!openSetId) return;

    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  async function sha256File(file) {
    if (!file || file.size > 128 * 1024 * 1024) return null;
    try {
      const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());

    } catch (_) { return null; }
  }

        signal:controller.signal,

  async function confirmImportedFile(characterId, file, sha, beforeIds, categories, beforeItem, deadlineMs=120000) {
    const deadline = Date.now() + deadlineMs;
    await sleep(300);
    while (!importCancel && Date.now() < deadline) {
      try {
        let lib;
        try { lib = await nativeLibrary(8000); }
        catch (_) { lib = await gmRequest({path:'/api/library', timeout:8000}); }
        const item = (lib?.media || []).find(m => {
          if (m.character_id !== characterId) return false;
          if (sha) return m.sha256 === sha;
          return !beforeIds.has(m.id) && m.original_name === file.name;
        });
        if (item) {
          const duplicate = beforeIds.has(item.id);
          if (!duplicate) return {item, duplicate:false, confirmed:true};
          if (item.media_type === 'video') return {item, duplicate:true, confirmed:true};
          const required = Array.isArray(categories) ? categories : [];
          const beforeCats = Array.isArray(beforeItem?.categories) ? beforeItem.categories : [];
          const nowCats = Array.isArray(item.categories) ? item.categories : [];
          const noChangeNeeded = required.every(id => beforeCats.includes(id));
          const serverAppliedChange = required.every(id => nowCats.includes(id));
          if (noChangeNeeded || serverAppliedChange) return {item, duplicate:true, confirmed:true};
        }
      } catch (_) {}
      await sleep(450);
    }
    throw new Error(importCancel ? 'Import canceled' : 'The import could not be confirmed.');
  }

        if (side) {
          el = document.createElement('div'); el.id = 'naiUploadProgress253';
          el.className = 'muted'; el.setAttribute('role','status');
          el.style.marginTop = '10px'; side.appendChild(el);
        } else el = modalRoot.querySelector('#importStatus');
      }
      if (el) el.textContent = message;
    };
    const request = (path, body, timeout=30000) => new Promise((resolve, reject) => {
      checkCanceled();
      let settled = false;
      const finish = (err, value) => {
        if (settled) return;
        settled = true; clearTimeout(timer); rejectPending = null;
        if (err) reject(err); else resolve(value);
      };
      const timer = setTimeout(() => {
        const error = new Error('The import stopped responding. You can retry Save or use X to skip this file.');
        error.retryable = true;
        finish(error);
        try { requestHandle?.abort?.(); } catch (_) {}
      }, timeout);
      rejectPending = err => finish(err);
      const fail = message => {
        const error = new Error(message); error.retryable = true; finish(error);
      };
      try {
        requestHandle = GM_xmlhttpRequest({method:body === null ? 'GET' : 'POST', url:`${API}${path}`,
          headers:{Origin:'https://novelai.net', 'Content-Type':'application/json'},
          data:body === null ? null : JSON.stringify(body), timeout,
          onload:res => {
            let value;
            try { value = JSON.parse(res.responseText || '{}'); }
            catch (_) { fail('The companion returned an invalid upload response.'); return; }
            if (res.status >= 200 && res.status < 300) finish(null, value);
            else {
              const error = new Error(value.error || `Upload failed (${res.status})`);
              error.retryable = res.status === 0 || res.status >= 500;
              finish(error);
            }
          },
          onerror:()=>fail('Could not reach the local companion during import.'),
          ontimeout:()=>fail('The upload step timed out. Retry Save or use X to skip this file.'),
          onabort:()=>finish(new Error('Import canceled')),
        });
      } catch (err) { finish(err); }
    });
    const post = async (action, body, timeout=30000) => {
      for (let attempt=0; ; attempt++) {
        checkCanceled();
        try { return await request(`/api/import/chunked/${token}/${action}`, body, timeout); }
        catch (err) { if (canceled || !err.retryable || attempt >= 1) throw err; }
      }
    };
    try {
      progress('Preparing upload…');
      if (!chunkUploadsAvailable) {
        const health = await request('/api/health', null);
        checkCanceled();
        if (!health?.chunked_uploads) throw new Error('Restart the companion to install the update for larger file imports, then retry Save.');
        chunkUploadsAvailable = true;
      }
      const ready = await post('start', {character_id:characterId, filename:file.name || 'upload',
        size:file.size, content_type:file.type || '', categories:Array.isArray(categories) ? categories : [], source_url:sourceUrl,pending_review:pending});
      let offset = ready.offset;
      if (!Number.isSafeInteger(offset) || offset < 0 || offset > file.size) throw new Error('Invalid upload position from companion.');
      while (offset < file.size) {
        checkCanceled();
        progress(`Saving ${formatBytes(offset)} / ${formatBytes(file.size)} (${Math.floor(offset/file.size*100)}%)…`);
        const bytes = new Uint8Array(await file.slice(offset, offset + chunkSize).arrayBuffer());
        checkCanceled();
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        checkCanceled();
        const sha256 = [...new Uint8Array(digest)].map(x => x.toString(16).padStart(2,'0')).join('');
        const pieces = [];
        for (let i=0; i<bytes.length; i+=32768) pieces.push(String.fromCharCode(...bytes.subarray(i,i+32768)));
        const data = btoa(pieces.join(''));
        const result = await post('chunk', {offset, data, sha256});
        if (result.offset !== offset + bytes.length) throw new Error('Companion acknowledged an unexpected upload position.');
        offset = result.offset;
      }
      checkCanceled();
      progress('Upload complete. Checking and saving file…');
      const result = await post('finish', {}, 120000);
      checkCanceled();
      if (!result?.item?.id) throw new Error('The companion did not confirm the saved file.');
      console.info(`[NovelAI Media timing] chunked import response: ${Math.round(performance.now()-started)} ms`);
      progress('File saved. Updating categories…');
      return result;
    } catch (err) {
      cleanup();
      progress(err?.message || 'Import failed.');
      throw err;
    } finally {
      if (activeUploadHandle === control) activeUploadHandle = null;
    }
  }

  async function uploadFileResilient(file, characterId, categories, sourceUrl='') {
    if (file.size > 8 * 1024 * 1024) return uploadFileChunked(file, characterId, categories, sourceUrl);
    // Small files retain the single-request path; larger files must stay below the
    // browser extension message cap by using bounded, ASCII-encoded chunks.
    const form = new FormData();
    form.append('character_id', characterId);
    form.append('categories', JSON.stringify(Array.isArray(categories) ? categories : []));
    form.append('file', file, file.name || 'upload');
    if (sourceUrl) form.append('source_url', sourceUrl);
    const started = performance.now();
    return await new Promise((resolve, reject) => {
      activeUploadHandle = GM_xmlhttpRequest({
        method:'POST',
        url:`${API}/api/import/file`,
        data:form,
        // A stuck companion request must not permanently lock Rapid Review.  Users can
        // also close a save in progress, which aborts this request and restores controls.
        timeout:90000,
        headers:{Origin:'https://novelai.net'},
        onload:res => {
          activeUploadHandle = null;
          const elapsed = Math.round(performance.now() - started);
          console.info(`[NovelAI Media timing] local import response: ${elapsed} ms`);
          if (res.status >= 200 && res.status < 300) {
            try { resolve(JSON.parse(res.responseText || '{}')); }
            catch (_) { resolve(null); }
            return;
          }
          let message = `Request failed (${res.status})`;
          try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
          reject(new Error(message));
        },
        onerror:()=>{
          activeUploadHandle = null;
          reject(new Error(importCancel ? 'Import canceled' : 'Could not connect to the local NovelAI Media Library program.'));
        },
        ontimeout:()=>{
          activeUploadHandle = null;
          reject(new Error(importCancel ? 'Import canceled' : 'The local media request timed out.'));
        },
        onabort:()=>{
          activeUploadHandle = null;
          reject(new Error('Import canceled'));
        },
      });
    });
  }

  async function confirmImportedUrl(characterId, url, beforeIds, categories, beforeItem, deadlineMs=120000) {
    const deadline = Date.now() + deadlineMs;
    await sleep(500);
    while (!importCancel && Date.now() < deadline) {
      try {
        const lib = await gmRequest({path:'/api/library', timeout:12000});
        const item = (lib?.media || []).find(m =>
          m.character_id === characterId &&
          (!beforeIds.has(m.id) || m.source?.url === url) &&
          m.source?.kind === 'url' && m.source?.url === url
        );
        if (item) {
          const duplicate = beforeIds.has(item.id);
          if (!duplicate) return {item, duplicate:false, confirmed:true};
          if (item.media_type === 'video') return {item, duplicate:true, confirmed:true};
          const required = Array.isArray(categories) ? categories : [];
          const beforeCats = Array.isArray(beforeItem?.categories) ? beforeItem.categories : [];
          const nowCats = Array.isArray(item.categories) ? item.categories : [];
          const noChangeNeeded = required.every(id => beforeCats.includes(id));
          const serverAppliedChange = required.every(id => nowCats.includes(id));
          if (noChangeNeeded || serverAppliedChange) return {item, duplicate:true, confirmed:true};
        }
      } catch (_) {}
      await sleep(600);
    }
    return null;
  }

  async function uploadUrlResilient(url, characterId, categories) {
    const before = library || await refreshLibrary();
    const beforeIds = new Set((before.media || []).map(m => m.id));
    const beforeItem = (before.media || []).find(m =>
      m.character_id === characterId && m.source?.kind === 'url' && m.source?.url === url
    ) || null;
    let requestReject = null;
    const requestPromise = new Promise((resolve, reject) => {
      activeUploadHandle = GM_xmlhttpRequest({
        method:'POST', url:`${API}/api/import/url`, timeout:300000,
        headers:{Origin:'https://novelai.net','Content-Type':'application/json'},
        data:JSON.stringify({character_id:characterId, categories, url}),
        onload:res => {
          activeUploadHandle = null;
          if (res.status >= 200 && res.status < 300) {
            try { resolve(JSON.parse(res.responseText || '{}')); } catch (_) { resolve(null); }
          } else {
            let message = `Request failed (${res.status})`;
            try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
            reject(new Error(message));
          }
        },
        onerror:()=>{ activeUploadHandle = null; reject(new Error(importCancel ? 'Import canceled' : 'Could not connect to the local NovelAI Media Library program.')); },
        ontimeout:()=>{ activeUploadHandle = null; reject(new Error(importCancel ? 'Import canceled' : 'The local media request timed out.')); },
      });
    }).catch(err => { requestReject = err; return null; });
    const confirmPromise = confirmImportedUrl(characterId, url, beforeIds, categories, beforeItem).catch(() => null);
    while (!importCancel) {
      const winner = await Promise.race([
        requestPromise.then(value => ({source:'request', value})),
        confirmPromise.then(value => ({source:'confirm', value})),
      ]);
      if (winner.value?.item?.id) {
        if (winner.source === 'confirm' && activeUploadHandle?.abort) {
          try { activeUploadHandle.abort(); } catch (_) {}
          activeUploadHandle = null;
        }
        return winner.value;
      }
      const other = winner.source === 'request' ? await confirmPromise : await requestPromise;
      if (other?.item?.id) return other;
      break;
    }
    if (importCancel) throw new Error('Import canceled');
    throw requestReject || new Error('The URL import could not be confirmed.');
  }

  async function runOwnImport(reviewAfter) {
    if (importBusy) return;
    const dropZone = syncImportModalMirror();
    if (!dropZone) return;
    const isUrl = !modalRoot.querySelector('#urlPane')?.classList.contains('hidden');
    const urls = isUrl ? String(modalRoot.querySelector('#urlInput')?.value || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean) : [];
    const jobs = isUrl ? urls.map(url => ({kind:'url', url})) : orderedReviewFiles(mirroredFiles).map(file => ({kind:'file', file}));
    const status = modalRoot.querySelector('#importStatus');
    const progress = modalRoot.querySelector('#importProgress');
    const bar = progress?.firstElementChild;
    if (!jobs.length) {
      if (status) { status.textContent = 'Choose at least one file or URL.'; status.classList.add('bad'); }
      return;
    }

    importBusy = true;
    importCancel = false;
    const categories = importSelectedCategories();
    const characterId = currentCharacterId();
    if (reviewAfter) {
      try {
        const health=await gmRequest({path:'/api/health'});if(!health.persistent_rapid_review)throw Error('Restart the companion to enable the persistent Rapid Review queue.');
        let prepared=0;
        for (const job of jobs) {
          if(importCancel)break;
          if(status)status.textContent=`Saving queue file ${prepared+1} of ${jobs.length}…`;
          const file=job.kind==='file'?job.file:await downloadUrlPreview(job.url);
          if(importCancel)break;
          await uploadFileChunked(file,characterId,categories,job.url||'',true);prepared++;
        }
        mirroredFiles=[];
        if(prepared && !importCancel)await resumeRapid();
        else await updateResumeButton();
      } catch(err){await updateResumeButton();throw Error(err.message+' Files already saved to the queue are retained. Use Resume Rapid Review.');}
      finally{importBusy=false;activeUploadHandle=null;}
      return;
    }
    const importedIds = [];
    const errors = [];
    progress?.classList.remove('hidden','indeterminate');
    if (bar) bar.style.width = '0%';
    modalRoot.querySelectorAll('button,input,textarea').forEach(el => { if (!el.matches('[data-close]')) el.disabled = true; });
    modalRoot.querySelectorAll('[data-close]').forEach(el => { el.disabled = false; });

    const oldCancel = modalRoot.querySelector('#importCancelBtn');
    const cancel = oldCancel?.cloneNode(true);
    if (oldCancel && cancel) {
      cancel.removeAttribute('data-close');
      cancel.disabled = false;
      cancel.textContent = 'Cancel Import';
      oldCancel.replaceWith(cancel);
      cancel.addEventListener('click', event => {
        event.preventDefault();
        importCancel = true;
        try { activeUploadHandle?.abort?.(); } catch (_) {}
        activeUploadHandle = null;
        if (status) status.textContent = 'Canceling import…';
        setTimeout(() => {
          if (modalRoot.querySelector('#fileDropZone')) modalRoot.innerHTML = '';
          refreshBtn?.click();
          schedulePseudoSync();
          scheduleMainFilter();
        }, 0);
      });
    }

    if (status) {
      status.classList.remove('bad');
      status.textContent = `Starting import of ${jobs.length} item${jobs.length === 1 ? '' : 's'}…`;
    }

    try {
      // Do not refresh the entire library here. In 2.7.4 this request could stall
      // before the upload even started, producing the exact blank-status screen.
      for (let i = 0; i < jobs.length; i++) {
        if (importCancel) break;
        const job = jobs[i];
        if (status) {
          status.classList.remove('bad');
          status.textContent = `Importing ${i + 1} of ${jobs.length}… ${job.kind === 'file' ? job.file.name : job.url}`;
        }
        if (bar) bar.style.width = `${Math.round((i / jobs.length) * 100)}%`;
        try {
          const result = job.kind === 'file'
            ? await uploadFileResilient(job.file, characterId, categories)
            : await uploadUrlResilient(job.url, characterId, categories);
          if (result?.item?.id) {
            if (!importedIds.includes(result.item.id)) importedIds.push(result.item.id);
            if (library && Array.isArray(library.media)) {
              const existingIndex = library.media.findIndex(m => m.id === result.item.id);
              if (existingIndex >= 0) library.media[existingIndex] = result.item;
              else library.media.push(result.item);
            }
          }
        } catch (err) {
          if (importCancel) break;
          errors.push(`${job.kind === 'file' ? job.file.name : job.url}: ${err?.message || err}`);
        }
      }
      if (bar) bar.style.width = '100%';

      if (importCancel) {
        if (status) status.textContent = `Import canceled. Imported ${importedIds.length} item(s).`;
        return;
      }
      if (status) status.textContent = `Imported ${importedIds.length} item(s)${errors.length ? `; ${errors.length} failed` : ''}.`;
      if (errors.length) console.warn('[NovelAI Media] import errors', errors);

      if (reviewAfter && importedIds.length) {
        mirroredFiles = [];
        const reviewStarted = performance.now();
        modalRoot.innerHTML = '';
        await openReviewQueue(importedIds, 'import');
        console.info(`[NovelAI Media timing] Rapid Review opened: ${Math.round(performance.now() - reviewStarted)} ms`);
      } else if (importedIds.length || !errors.length) {
        mirroredFiles = [];
        setTimeout(() => {
          modalRoot.innerHTML = '';
          refreshBtn?.click();
          schedulePseudoSync();
          scheduleMainFilter();
        }, 300);
      } else {
        modalRoot.querySelectorAll('button,input,textarea').forEach(el => el.disabled = false);
        if (status) status.classList.add('bad');
      }
    } finally {
      importBusy = false;
      activeUploadHandle = null;
    }
  }

  function orderedReviewFiles(files) {
    // Use descending natural filename order so numbered batches remain intuitive:
    // Image_1000, Image_999, Image_998 (rather than lexicographic 998, 999, 1000).
    // Array#sort is stable in supported browsers, so identical names retain picker order.
    return [...files].sort((a, b) => String(b?.name || '').localeCompare(String(a?.name || ''), undefined, {numeric:true, sensitivity:'base'}));
  }

  async function downloadUrlPreview(url) {
    return new Promise((resolve, reject) => {
      activeUploadHandle = GM_xmlhttpRequest({
        method:'POST', url:`${API}/api/preview/url`, responseType:'blob', timeout:300000,
        headers:{Origin:'https://novelai.net','Content-Type':'application/json'}, data:JSON.stringify({url}),
        onload:async res => {
          activeUploadHandle = null;
          if (res.status >= 200 && res.status < 300) {
            const header = /(?:^|\n)x-novelai-filename:\s*([^\r\n]+)/i.exec(res.responseHeaders || '');
            const name = header ? decodeURIComponent(header[1].trim()) : 'download';
            resolve(new File([res.response], name, {type:res.response.type}));
          } else {
            let message = res.status === 404 ? 'URL previews need companion runtime 2.7.9. Let the running companion update, then try again.' : `Preview failed (${res.status})`;
            try { message = JSON.parse(await res.response.text()).error || message; } catch (_) {}
            reject(new Error(message));
          }
        },
        onerror:()=>{ activeUploadHandle = null; reject(new Error('Could not download this URL preview.')); },
        ontimeout:()=>{ activeUploadHandle = null; reject(new Error('URL preview timed out.')); },
        onabort:()=>{ activeUploadHandle = null; reject(new Error('Preview canceled.')); },
      });
    });
  }

  function addReviewDraft(file, characterId, categories, sourceUrl='') {
    const id = `draft_${importToken274()}`;
    const video = file.type.startsWith('video/') || /\.(mp4|webm|mov|m4v|avi|mkv)$/i.test(file.name);
    const media = {id, character_id:characterId, original_name:file.name, media_type:video?'video':'image',
      categories:categories.filter(id => ((library?.characters || []).find(c => c.id === characterId)?.categories || []).some(cat => cat.id === id && (cat.media_type || 'image') === (video ? 'video' : 'image'))), favorite:false, featured:false, needs_replacement:false, in_review:false, crop_top:0, crop_bottom:0};
    drafts.set(id, {media, file, sourceUrl, url:URL.createObjectURL(file), persistedId:null, setPlan:null, cropDirty:false});
    return id;

        data:JSON.stringify({media_ids:merged, cover_media_id:set.cover_media_id || merged[0],cover_source:set.cover_media_id?(set.cover_source || 'unknown'):'auto'})});
    } else {

        data:JSON.stringify({character_id:characterId, name:plan.name, media_ids:ids, cover_media_id:ids[0],cover_source:'auto'})});

  async function persistReviewMedia(m) {
    if (!m) return null;
    const draft = drafts.get(m.id);
    let id = draft?.persistedId || m.id;
    if (draft && !draft.persistedId) {
      const result = await uploadFileResilient(draft.file, m.character_id, m.categories, draft.sourceUrl);
      if (!result?.item?.id) throw new Error('The media item could not be saved. Please try again.');
      id = draft.persistedId = result.item.id;
      // Remember registration immediately: a later metadata failure must not re-upload on retry.
    }
    const post = async (action, data) => gmRequest({method:'POST', path:`/api/media/${encodeURIComponent(id)}/${action}`,
      headers:{'Content-Type':'application/json'}, data:JSON.stringify(data)});
    const placement={categories:m.categories,...(m.rapid_main?{[m.media_type==='video'?'in_videos':'in_all']:true}:{})};
    const categorized=await post('categories',placement);
    await post('favorite', {favorite:m.favorite});
    await post('featured', {featured:!!m.featured});
    if (m.media_type !== 'video') {
      await post('needs-replacement', {needs_replacement:!!m.needs_replacement});
      if (draft?.cropDirty) {
        await post('crop', {top:m.crop_top, bottom:m.crop_bottom});
        draft.cropDirty = false;
      }
    }
    if(m.in_review)await post('review',{in_review:true});
    else if(categorized.in_review||categorized.in_purgatory){await post('clear-holding',{});await post('categories',placement);}
    if (draft?.setPlan) await applyReviewSet(draft.setPlan, [id], m.character_id);
    return id;
  }

  async function saveCurrentReview() {
    if (!reviewSession) return;
    captureReviewChoices();
    const m = currentReviewMedia();
    if (!m) return;
    const id = await persistReviewMedia(m);
    if (id) reviewSession.saved.add(m.id);
  }

  async function assignReviewMediaToSet(selectedIds, setId, characterId) {
    if (!reviewSession || !setId) return;
    if(pendingMode()){await resolvePending('set',selectedIds,{set_id:setId});return;}
    const beforeIds = [...reviewSession.ids];
    const beforeIndex = reviewSession.index;
    const selected = new Set(selectedIds);
    const savedIds = [];
    for (const queueId of selectedIds) {
      const m = mediaById(queueId);
      if (!m) continue;
      Object.assign(m, reviewSession.choices?.get(queueId) || {});
      m.in_review=false;
      const persistedId = await persistReviewMedia(m);
      if (!persistedId) throw new Error('The media item could not be saved. Please try again.');
      savedIds.push(persistedId);
    }
    if (!savedIds.length) return;
    await applyReviewSet({id:setId, name:''}, savedIds, characterId);

    // Set assignment is an explicit save action: release draft URLs and remove every
    // assigned image from the review queue, leaving only unchecked items to review.
    for (const queueId of selected) {
      const draft = drafts.get(queueId);
      if (draft) {
        try { URL.revokeObjectURL(draft.url); } catch (_) {}
        drafts.delete(queueId);
      }
      reviewSession.choices?.delete(queueId);
      reviewSession.saved.delete(queueId);reviewSession.selected?.delete(queueId);
    }
    const removedBefore = beforeIds.slice(0, beforeIndex).filter(id => selected.has(id)).length;
    reviewSession.ids = beforeIds.filter(id => !selected.has(id));
    reviewSession.index = Math.max(0, Math.min(beforeIndex - removedBefore, reviewSession.ids.length - 1));
    await refreshLibrary();
  }

  async function reviewMove(delta) {
    if (!reviewSession || reviewSession.busy) return;
    const session = reviewSession;
    session.busy = true;
    modalRoot.querySelectorAll('button,input').forEach(el => { if (el.id !== 'naiReviewClose270') el.disabled = true; });
    try {
      if(pendingMode()){
        await resolvePending('save',[session.ids[session.index]]);session.busy=false;
        if(!session.ids.length)return finishReviewQueue();await renderReviewQueue();return;
      }
      await saveCurrentReview();
      if (session.canceled || reviewSession !== session) return;
      const next = session.index + delta;
      session.busy = false;
      if (next >= session.ids.length) {
        if (session.ids.length === 1) return finishReviewQueue();
        session.index = 0;
      } else session.index = Math.max(0, next);
      await renderReviewQueue();
    } catch (err) {
      if (!session.canceled) {
        alert(err?.message || String(err));
        modalRoot.querySelectorAll('button,input').forEach(el => el.disabled = false);
      }
    } finally { if (!session.canceled) session.busy = false; }
  }

  async function cancelBusyReview() {
    const session = reviewSession;
    if (!session) return;
    session.canceled = true;
    try { activeUploadHandle?.abort?.(); } catch (_) {}
    activeUploadHandle = null;
    // Discard only the interrupted file; its remaining queue previews stay open.
    const failedId = session.ids[session.index];
    const draft = drafts.get(failedId);
    if (draft) {
      try { URL.revokeObjectURL(draft.url); } catch (_) {}
      drafts.delete(failedId);
    }
    const nextIds = session.ids.filter(id => id !== failedId);
    if (!nextIds.length) {
      session.busy = false;
      return finishReviewQueue(true);
    }
    reviewSession = {
      ...session,
      ids:nextIds,
      index:Math.min(session.index, nextIds.length - 1),
      saved:new Set([...session.saved].filter(id => id !== failedId)),
      choices:new Map([...session.choices].filter(([id]) => id !== failedId)),
      busy:false,
      canceled:false,
    };
    await renderReviewQueue();
  }

  async function reviewJump(index) {
    if (!reviewSession || reviewSession.busy || index === reviewSession.index || index < 0 || index >= reviewSession.ids.length) return;
    captureReviewChoices();
    if(pendingMode())await persistQueueState();
    reviewSession.index = index;
    root.naiPersistRapidChoices();
    await renderReviewQueue();
  }

  function queuePreviewRange(total, index, requestedPage) {
    const pageSize = 14;
    const pages = Math.max(1, Math.ceil(total / pageSize));
    const requested = Number.isInteger(requestedPage) ? requestedPage : Math.floor(index / pageSize);
    const page = Math.max(0, Math.min(pages - 1, requested));
    const start = page * pageSize;
    return {page, pages, start, end:Math.min(total, start + pageSize)};
  }

  function showReviewQuality(m, element) {
    const draft=drafts.get(m.id);
    const fileBytes=draft?.file?.size ?? m.file_bytes;
    const write = (width,height) => {
      if (Number(width)>0 && Number(height)>0) {
        m.width=Number(width); m.height=Number(height);
        setReviewQuality(m.id,`Source quality: ${width} × ${height} · ${formatBytes(fileBytes)}`);
      } else if (fileBytes != null) setReviewQuality(m.id,`Source quality: ${formatBytes(fileBytes)} · Dimensions unavailable`);
    };
    if (m.width && m.height) return write(m.width,m.height);
    if (element?.tagName === 'IMG') {
      if (element.complete) write(element.naturalWidth,element.naturalHeight);
      else element.addEventListener('load',()=>write(element.naturalWidth,element.naturalHeight),{once:true});
    } else if (element?.tagName === 'VIDEO') {
      element.addEventListener('loadedmetadata',()=>write(element.videoWidth,element.videoHeight),{once:true});
    }
    if (!draft) gmRequest({path:`/api/media/${encodeURIComponent(m.id)}/quality`,timeout:15000}).then(info=>{
      if (!info) return;
      Object.assign(m,info);
      write(info.width,info.height);
    }).catch(()=>{ if (fileBytes != null) setReviewQuality(m.id,`Source quality: ${formatBytes(fileBytes)}`); });
  }
