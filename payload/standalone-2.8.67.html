(() => {
  'use strict';
  document.documentElement.dataset.naiStandalone = '1';
  window.GM_xmlhttpRequest = options => {
    const url = new URL(options.url, location.href);
    if (!['127.0.0.1','localhost'].includes(url.hostname) || url.port !== '8765' || !url.pathname.startsWith('/api/')) {
      queueMicrotask(() => options.onerror?.({status:0,error:'Only local companion requests are supported.'}));
      return {abort(){}};
    }
    const xhr = new XMLHttpRequest();
    xhr.open(options.method || 'GET', url.pathname + url.search, true);
    xhr.timeout = options.timeout || 0;
    if (options.responseType && options.responseType !== 'text') xhr.responseType = options.responseType;
    for (const [key,value] of Object.entries(options.headers || {})) {
      if (!/^(origin|host|referer|content-length|cookie)$/i.test(key)) xhr.setRequestHeader(key,value);
    }
    const response = event => ({
      status:xhr.status, statusText:xhr.statusText,
      response:xhr.response,
      responseText:!xhr.responseType || xhr.responseType === 'text' ? xhr.responseText : '',
      responseHeaders:xhr.getAllResponseHeaders(), finalUrl:xhr.responseURL,
      loaded:event?.loaded || 0, total:event?.total || 0, lengthComputable:!!event?.lengthComputable,
    });
    for (const name of ['load','error','timeout','abort','loadend','loadstart','progress','readystatechange']) {
      xhr.addEventListener(name,event => options['on'+name]?.(response(event)));
    }
    if(options.upload?.onprogress)xhr.upload.onprogress=options.upload.onprogress;
    xhr.send(options.data ?? null);
    return {abort:()=>xhr.abort()};
  };
})();

// NovelAI Media Library v2.8.3: bound companion traffic across all payload layers.
// The wrapper is local to this assembled payload; it never patches NovelAI's globals.
((nativeCompanionRequest) => {
  'use strict';

  function createCompanionTransport(nativeRequest) {
    const pending = [];
    const sharedReads = new Map();
    const MAX_ACTIVE = 4;
    const MAX_THUMBNAILS = 2;
    let active = 0;
    let activeThumbnails = 0;
    let generation = 0;
    let pumpQueued = false;

    function notify(subscriber, event, response) {
      if (!subscriber.live) return;
      const callback = subscriber.options[event] || (event === 'onabort' ? subscriber.options.onerror : null);
      try { callback?.(response); }
      catch (error) { console.error('[NovelAI Media] request callback failed', error); }
    }

    function schedulePump() {
      if (pumpQueued) return;
      pumpQueued = true;
      queueMicrotask(pump);
    }

    function finish(job, event, response) {
      if (job.done) return;
      job.done = true;
      if (job.key && sharedReads.get(job.key) === job) sharedReads.delete(job.key);
      if (job.started) {
        active--;
        if (job.thumbnail) activeThumbnails--;
      } else {
        const index = pending.indexOf(job);
        if (index >= 0) pending.splice(index, 1);
      }
      if (!job.thumbnail && job.started && performance.now() - job.created > 2000) {
        console.info(`[NovelAI Media timing] ${job.method} ${job.path}: queue ${Math.round(job.startedAt - job.created)} ms, request ${Math.round(performance.now() - job.startedAt)} ms (${event})`);
      }
      for (const subscriber of job.subscribers) {
        notify(subscriber, event, response);
        notify(subscriber, 'onloadend', response);
        subscriber.live = false;
      }
      schedulePump();
    }

    function pump() {
      pumpQueued = false;
      while (active < MAX_ACTIVE) {
        // Foreground saves/imports and original images bypass queued thumbnails.
        let index = pending.findIndex(job => !job.thumbnail && !job.background);
        if (index < 0 && activeThumbnails < MAX_THUMBNAILS) index = pending.findIndex(job => job.thumbnail);
        if (index < 0 && active < MAX_ACTIVE-1) index=pending.findIndex(job=>job.background);
        if (index < 0) return;
        const job = pending.splice(index, 1)[0];
        job.started = true;
        job.startedAt = performance.now();
        active++;
        if (job.thumbnail) activeThumbnails++;
        const options = {...job.options};
        delete options.naiBackground;
        for (const event of ['onload', 'onerror', 'ontimeout', 'onabort']) options[event] = response => finish(job, event, response);
        options.onloadend = () => {};
        for (const event of ['onprogress', 'onloadstart', 'onreadystatechange']) {
          options[event] = response => job.subscribers.forEach(subscriber => notify(subscriber, event, response));
        }
        try { job.handle = nativeRequest(options); }
        catch (error) { finish(job, 'onerror', {status:0, error:String(error)}); }
      }
    }

    return function request(options) {
      let url;
      try { url = new URL(options.url); } catch (_) { return nativeRequest(options); }
      if (!['127.0.0.1', 'localhost'].includes(url.hostname) || url.port !== '8765' || !url.pathname.startsWith('/api/')) {
        return nativeRequest(options);
      }
      const method = String(options.method || 'GET').toUpperCase();
      if (method === 'GET' && /\/api\/media\/[^/]+\/(original|thumb)$/.test(url.pathname)) {
        const versioned = document.getElementById('nai-media-host')?.shadowRoot?.naiVersionMediaUrl?.(url.href);
        if (versioned) { url = new URL(versioned); options = {...options, url:url.href}; }
      }
      if (method !== 'GET' && method !== 'HEAD') {
        // A read requested after a write must not reuse a pre-write snapshot.
        generation++;
        sharedReads.clear();
      }
      const thumbnail = method === 'GET' && /\/thumb$/.test(url.pathname);
      const shareable = method === 'GET' && (url.pathname === '/api/library' || thumbnail);
      const key = shareable ? JSON.stringify([generation, url.href, options.responseType || 'text', options.timeout || 0, options.headers || {}]) : null;
      let job = key ? sharedReads.get(key) : null;
      const subscriber = {options, live:true};
      if (job) job.subscribers.push(subscriber);
      else {
        job = {options, background:!!options.naiBackground, method, path:url.pathname, thumbnail, key, subscribers:[subscriber], created:performance.now(), started:false, done:false, handle:null};
        if (key) sharedReads.set(key, job);
        pending.push(job);
        schedulePump();
      }
      return {
        abort() {
          if (!subscriber.live || job.done) return;
          notify(subscriber, 'onabort', {status:0, error:'Request aborted'});
          notify(subscriber, 'onloadend', {status:0});
          subscriber.live = false;
          if (!job.subscribers.some(item => item.live)) {
            finish(job, 'onabort', {status:0});
            try { job.handle?.abort?.(); } catch (_) {}
          }
        },
      };
    };
  }

  const GM_xmlhttpRequest = createCompanionTransport(nativeCompanionRequest);

    const saved = JSON.parse(localStorage.getItem(key) || '{}') || {};

  // its own observers, image requests, and event handlers, which can stall the
  // page even though the companion itself is idle. Keep exactly one base host.
  const existingHost = document.getElementById('nai-media-host');
  if (existingHost) {
    existingHost.dataset.naiMediaDuplicateSuppressed = '1';
    console.warn('[NovelAI Media] duplicate payload suppressed; keeping the existing library host.');
    return;
  }
  document.documentElement.dataset.naiMediaPayloadInstance = '2.8.52';

  const STANDALONE = document.documentElement.dataset.naiStandalone === '1';
  const API = 'http://127.0.0.1:8765';

  const FEATURED_CHARACTER_ID = '__nai_featured__';
  const FEATURED_VIDEOS_CHARACTER_ID = '__nai_featured_videos__';
  const isFeaturedView = id => id === FEATURED_CHARACTER_ID || id === FEATURED_VIDEOS_CHARACTER_ID;

  const state = {
    library: null,
    characterId: null,
    categoryId: 'all',
    selectedMediaId: null,
    search: '',

    connected: false,
    thumbCache: new Map(),
    splitView: false,
    activeSlot: 0,
    slotMediaIds: [null, null],
    slotObjectUrls: [null, null],
    reviewQueue: [],
    reviewIndex: 0,
    carryReviewCategories: false,
    carryCategories: null,
    qualityToken: 0,
    libraryLoadToken: 0,
    sortMode: 'imported',
    sortDirection: 'asc',
    randomSortToken: Math.random().toString(36).slice(2),
    featuredFavoritesMode: false,
    featuredVideosMode: false,
    mediaMode: 'images',
    characterSorts: {},
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
    state.characterId = saved.characterId || null;
    state.categoryId = saved.categoryId || 'all';
    state.selectedMediaId = saved.selectedMediaId || null;
    state.splitView = !!saved.splitView;
    state.activeSlot = saved.activeSlot === 1 ? 1 : 0;
    state.slotMediaIds = Array.isArray(saved.slotMediaIds) ? [saved.slotMediaIds[0] || null, saved.slotMediaIds[1] || null] : [state.selectedMediaId, null];
    if (!state.slotMediaIds[0] && state.selectedMediaId) state.slotMediaIds[0] = state.selectedMediaId;
    state.selectedMediaId = state.slotMediaIds[state.activeSlot] || state.slotMediaIds[0] || null;
    state.visible = saved.visible !== false;
    state.sortMode = ['imported','pixels','bytes','random'].includes(saved.sortMode) ? saved.sortMode : 'imported';
    state.sortDirection = saved.sortDirection === 'desc' ? 'desc' : 'asc';
    state.mediaMode = saved.mediaMode === 'videos' || saved.categoryId === 'videos' ? 'videos' : 'images';
    state.characterSorts = saved.characterSorts && typeof saved.characterSorts === 'object' ? saved.characterSorts : {};
    if (state.characterId && !isFeaturedView(state.characterId) && !state.characterSorts[state.characterId]) {
      state.characterSorts[state.characterId] = {mode:state.sortMode, direction:state.sortDirection, randomSortToken:state.randomSortToken};
    }
  } catch (_) {}

  if (STANDALONE) { state.splitView = true; state.visible = true; state.activeSlot = 0; }

    localStorage.setItem(STATE_KEY, JSON.stringify({
      characterId: state.characterId,
      categoryId: state.categoryId,
      selectedMediaId: state.selectedMediaId,
      splitView: state.splitView,
      activeSlot: state.activeSlot,
      slotMediaIds: state.slotMediaIds,
      visible: state.visible,
      sortMode: state.sortMode,
      sortDirection: state.sortDirection,
      mediaMode: state.mediaMode,
      characterSorts: state.characterSorts,

      GM_xmlhttpRequest({
        method,
        url: `${API}${path}`,
        data,
        headers: { Origin: 'https://novelai.net', ...headers },
        responseType,
        timeout,
        naiBackground,
        onload: (res) => {

    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;

  async function canvasThumbnailBlob(video) {
    if (!video || !video.videoWidth || !video.videoHeight) throw new Error('Wait for the video frame to appear first.');
    const maxSide = 840;
    const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.86));
    if (!blob) throw new Error('Could not capture this video frame.');
    return blob;
  }

    const thumbTime = m.video_thumb_seconds !== null && m.video_thumb_seconds !== undefined && Number.isFinite(Number(m.video_thumb_seconds)) ? Number(m.video_thumb_seconds) : null;

          method:'POST',

          data: blob,
          timeout: 300000,

        if (!Number.isFinite(savedThumbTime) || Math.abs(savedThumbTime - seconds) > 0.000001) {
          throw new Error('Thumbnail was saved, but its timestamp could not be saved.');

  // Chromium delays native picture clicks by 300ms for double-click detection.
  // Cancel that default action and toggle immediately, outside the controls band.
  const pictureClicks = new WeakMap();
  shadow.addEventListener('click', event => {
    const video = event.target;
    if (video?.tagName !== 'VIDEO' || event.button !== 0) return;
    if(STANDALONE && video._naiSelectionClick){
      video._naiSelectionClick=false;pictureClicks.set(video,video.paused);
      event.preventDefault();event.stopImmediatePropagation();return;
    }
    const rect = video.getBoundingClientRect();
    if (video.controls && event.clientY >= rect.bottom - 64) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (event.detail > 1) return;
    pictureClicks.set(video, video.paused);
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  }, true);
  shadow.addEventListener('dblclick', event => {
    const video = event.target;
    if (video?.tagName !== 'VIDEO' || event.clientY >= video.getBoundingClientRect().bottom - 64) return;
    event.preventDefault(); event.stopImmediatePropagation();
    // Restore the playback state before the first click, then toggle fullscreen.
    if (pictureClicks.get(video)) video.pause();

  async function setVideoSourceWithFallback(video, m, slot = null) {
    video.controls = true;
    video.preload = 'metadata';
    video.playsInline = true;
    video.loop = true;
    video.volume = 0.08;
    video.src = directOriginalUrl(m.id);
    let triedFallback = false;
    video.addEventListener('error', async () => {
      if (triedFallback || !video.isConnected) return;
      triedFallback = true;
      try {
        const blob = await gmRequest({ path: `/api/media/${m.id}/original`, responseType: 'blob', timeout: 300000 });
        const url = URL.createObjectURL(blob);
        if (slot !== null) {
          revokeSlotUrl(slot);
          state.slotObjectUrls[slot] = url;
        } else {
          video._naiBlobUrl = url;
        }
        video.src = url;
        video.load();
      } catch (_) {}
    }, { once: true });
  }

  async function renderSlot(slot, mediaId) {
    clearTimeout(prefetchTimer);++prefetchGeneration;
    const el = stageEls[slot];
    const renderToken = (el._naiRenderToken || 0) + 1;
    el._naiRenderToken = renderToken;
    const m = mediaById(mediaId);
    const oldVideo = el.querySelector('video');
    if (oldVideo) oldVideo.pause();
    revokeSlotUrl(slot);
    el.innerHTML = '';
    trimViewer();
    if (!m) {
      el.innerHTML = `<div class="muted slotHint">${slot === 1 ? 'Click this slot, then choose any image or video — even from the same character.' : 'Choose an image or video from the library.'}</div>`;
      return;
    }
    if (m.media_type === 'video') {
      const video = document.createElement('video');
      // A click on an already-active video should only control playback. Re-running
      // setActiveSlot here rebuilt the grid and reloaded source quality on every
      // pause/play click, which caused the visible thumbnail flicker and delay.
      video.addEventListener('pointerdown', () => {
        if (state.activeSlot !== slot) setActiveSlot(slot);
      }, { passive: true });
      await setVideoSourceWithFallback(video, m, slot);
      if (el._naiRenderToken !== renderToken) return;
      el.appendChild(video);
      return;
    }
    const preview=cachedThumb(m.id);
    if(preview){
      const img=document.createElement('img');img.src=preview;img.alt=m.original_name || '';
      shadow.naiPrepareViewerImage?.(img,m);el.appendChild(img);
    }else el.innerHTML='<div class="muted">Loading…</div>';
    try {
      const asset=await viewerAsset(m);
      if(el._naiRenderToken!==renderToken)return;
      const img=document.createElement('img');img.src=asset.url;img.alt=m.original_name || '';
      shadow.naiPrepareViewerImage?.(img,m);
      state.slotObjectUrls[slot]=asset.url;
      img.addEventListener('click',async e=>{e.stopPropagation();await setActiveSlot(slot);if(!STANDALONE)openLightbox();});
      el.replaceChildren(img);
      prefetchNeighbors(m.id);
    }catch(err){
      if(el._naiRenderToken===renderToken)el.innerHTML=`<div class="muted">${escapeHtml(err.message)}</div>`;
    }finally{trimViewer();}
  }

    let pendingLocalFiles = [];
    const fileInput = modalRoot.querySelector('#fileInput');
    const dropZone = modalRoot.querySelector('#fileDropZone');
    const fileSummary = modalRoot.querySelector('#fileSummary');
    const clearFiles = modalRoot.querySelector('#clearFiles');

    function isLikelyMediaFile(file) {
      if (!file) return false;
      if ((file.type || '').startsWith('image/') || (file.type || '').startsWith('video/')) return true;
      return /\.(?:jpe?g|png|gif|webp|bmp|tiff?|avif|heic|heif|mp4|webm|mov|m4v|avi|mkv)$/i.test(file.name || '');
    }

    function addPendingFiles(files) {
      const incoming = [...files].filter(isLikelyMediaFile);
      const seen = new Set(pendingLocalFiles.map(f => `${f.name}::${f.size}::${f.lastModified}`));
      for (const file of incoming) {
        const key = `${file.name}::${file.size}::${file.lastModified}`;
        if (!seen.has(key)) {
          pendingLocalFiles.push(file);
          seen.add(key);
        }
      }
      paintFileSummary();
    }

    function paintFileSummary() {
      if (!pendingLocalFiles.length) {
        fileSummary.classList.add('hidden');
        fileSummary.innerHTML = '';
        clearFiles.disabled = true;
        return;
      }
      const shown = pendingLocalFiles.slice(0, 6).map(f => escapeHtml(f.name));
      const more = pendingLocalFiles.length > shown.length ? `<br>…and ${pendingLocalFiles.length - shown.length} more` : '';
      fileSummary.innerHTML = `<strong>${pendingLocalFiles.length} file${pendingLocalFiles.length === 1 ? '' : 's'} selected</strong><br>${shown.join('<br>')}${more}`;
      fileSummary.classList.remove('hidden');
      clearFiles.disabled = false;
    }

    function chooseFiles() { fileInput.click(); }
    dropZone.addEventListener('click', chooseFiles);

      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chooseFiles(); }

    fileInput.addEventListener('change', () => {

      pendingLocalFiles = [];
      fileInput.value = '';
      paintFileSummary();
    });
    for (const eventName of ['dragenter','dragover']) {
      dropZone.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        dropZone.classList.add('dragover');
      });
    }
    for (const eventName of ['dragleave','drop']) {
      dropZone.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      });

    dropZone.addEventListener('drop', e => {
      if (e.dataTransfer?.files?.length) addPendingFiles(e.dataTransfer.files);
    });

    let currentImportRequest = null;
    let importCanceled = false;

    async function doImport(review) {
      const selectedCats = selectedCategoryIds(modalRoot.querySelector('#importCats'));
      const progress = modalRoot.querySelector('#importProgress');
      const bar = progress.firstElementChild;
      const status = modalRoot.querySelector('#importStatus');
      const cancelBtn = modalRoot.querySelector('#importCancelBtn');
      progress.classList.remove('hidden');
      progress.classList.add('indeterminate');
      const importedIds = [];
      const errors = [];
      let jobs = [];
      if (activeTab === 'local') jobs = pendingLocalFiles.map(file => ({ kind:'file', file }));
      else jobs = modalRoot.querySelector('#urlInput').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean).map(url => ({ kind:'url', url }));
      if (!jobs.length) { status.textContent = 'Choose at least one file or URL.'; status.classList.add('bad'); return; }
      importCanceled = false;
      modalRoot.querySelectorAll('button, input, textarea').forEach(x => x.disabled = true);
      cancelBtn.disabled = false;
      cancelBtn.textContent = 'Cancel Import';
      cancelBtn.addEventListener('click', () => {
        importCanceled = true;
        if (currentImportRequest && typeof currentImportRequest.abort === 'function') currentImportRequest.abort();
        status.textContent = 'Canceling import…';
      }, { once: true });
      for (let i = 0; i < jobs.length; i++) {
        if (importCanceled) break;
        const job = jobs[i];
        status.textContent = `Importing ${i + 1} of ${jobs.length}… ${job.kind === 'file' ? job.file.name : job.url}`;
        bar.style.width = `${Math.round((i / jobs.length) * 100)}%`;
        try {
          let result;
          if (job.kind === 'file') {
            const form = new FormData();
            form.append('character_id', state.characterId);
            form.append('categories', JSON.stringify(selectedCats));
            form.append('file', job.file, job.file.name);
            result = await new Promise((resolve, reject) => {
              currentImportRequest = GM_xmlhttpRequest({
                method:'POST', url:`${API}/api/import/file`, data:form, timeout:300000, headers:{ Origin:'https://novelai.net' },
                onload:(res)=>{ currentImportRequest = null; if (res.status >= 200 && res.status < 300) { try { resolve(JSON.parse(res.responseText || '{}')); } catch (_) { resolve(null); } } else { try { reject(new Error(JSON.parse(res.responseText || '{}').error || `Request failed (${res.status})`)); } catch (_) { reject(new Error(`Request failed (${res.status})`)); } } },
                onerror:()=>{ currentImportRequest = null; reject(new Error(importCanceled ? 'Import canceled' : 'Could not connect to the local NovelAI Media Library program.')); },
                ontimeout:()=>{ currentImportRequest = null; reject(new Error(importCanceled ? 'Import canceled' : 'The local media request timed out.')); },
              });
            });
          } else {
            result = await gmRequest({ method:'POST', path:'/api/import/url', headers:{'Content-Type':'application/json'}, data:JSON.stringify({ character_id: state.characterId, categories:selectedCats, url:job.url }), timeout:300000 });
          }
          if (result?.item?.id && !importedIds.includes(result.item.id)) importedIds.push(result.item.id);
        } catch (err) {
          if (importCanceled && /canceled/i.test(String(err.message || ''))) break;
          errors.push(`${job.kind === 'file' ? job.file.name : job.url}: ${err.message}`);
        }
      }
      currentImportRequest = null;
      progress.classList.remove('indeterminate');
      bar.style.width = '100%';
      await loadLibrary(false);
      if (importCanceled) {
        status.textContent = `Import canceled. Imported ${importedIds.length} item(s).`;
        modalRoot.querySelectorAll('button, input, textarea').forEach(x => x.disabled = false);
        cancelBtn.textContent = 'Close';
        cancelBtn.addEventListener('click', close, { once: true });
        return;
      }
      status.textContent = `Imported ${importedIds.length} item(s)${errors.length ? `; ${errors.length} failed` : ''}.`;
      if (errors.length) console.warn('NovelAI Media import errors:', errors);
      if (review && importedIds.length) { close(); startReview(importedIds); }
      else { setTimeout(close, 650); }
    }

    modalRoot.querySelector('#importDirect').addEventListener('click', () => doImport(false));
    modalRoot.querySelector('#importReview').addEventListener('click', () => doImport(true));
  }

      reviewCats.innerHTML = '';

      (c?.categories || []).forEach((cat, idx) => {
        const label = document.createElement('label');

      });
    }

    let reviewUrl = null;
    try {
      if (m.media_type === 'video') {

        v.src = directOriginalUrl(m.id); v.controls = true; v.loop = true; v.volume = 0.08; rs.innerHTML = ''; rs.appendChild(v);
      } else {

      if (m.media_type === 'video') {

      }

      try {
        await saveCurrent();
        cleanup();
        state.reviewIndex += delta;
        if (state.reviewIndex < 0) state.reviewIndex = 0;
        if (state.reviewIndex >= state.reviewQueue.length) return finishReview();
        renderReviewModal();
      } catch (err) { alert(err.message); }
    }

    modalRoot.querySelector('#reviewNext').addEventListener('click', () => move(1));
    modalRoot.querySelector('#reviewPrev').addEventListener('click', () => move(-1));
    modalRoot.querySelector('#reviewDelete').addEventListener('click', async () => {
      if (!confirm('Delete this media item from the managed library?')) return;
      try {
        await gmRequest({ method:'DELETE', path:`/api/media/${m.id}` });
        cleanup();
        state.reviewQueue.splice(state.reviewIndex, 1);
        await loadLibrary(false);
        if (!state.reviewQueue.length || state.reviewIndex >= state.reviewQueue.length) return finishReview();
        renderReviewModal();
      } catch (err) { alert(err.message); }
    });

    const keyHandler = (e) => {
      if (!modalRoot.childElementCount) return document.removeEventListener('keydown', keyHandler, true);
      if (e.target.matches('input, textarea, select')) return;
      if (e.key >= '1' && e.key <= '9' && m.media_type !== 'video') {
        const i = Number(e.key) - 1;
        const boxes = [...reviewCats.querySelectorAll('input[data-catid]')];
        if (boxes[i]) { e.preventDefault(); boxes[i].checked = !boxes[i].checked; }
      } else if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
    };
    document.addEventListener('keydown', keyHandler, true);
  }

  function finishReview() {
    modalRoot.innerHTML = '';
    state.reviewQueue = [];
    state.reviewIndex = 0;
    loadLibrary();
  }

  loadLibrary(false);
})();

  function retain(key,record){

    record.decodedBytes=[...record.node.querySelectorAll('img')].reduce((sum,img)=>sum+(img.naturalWidth||420)*(img.naturalHeight||420)*4,0);
    recent.set(key,record);recentBytes+=record.decodedBytes;

    const paddingTop = parseFloat(css.paddingTop)||0;
    const paddingBottom = parseFloat(css.paddingBottom)||0;

    const width = grid.clientWidth || 500, height = grid.clientHeight || 700;

    metrics = measure();

    const scroll = Math.min(grid.scrollTop,Math.max(0,total-height));
    if (grid.scrollTop !== scroll) grid.scrollTop=scroll;
    const start = Math.max(0,Math.floor((scroll-paddingTop-headHeight)/stride)-bufferRows);
    const end = Math.min(rows,Math.max(start+1,Math.ceil((scroll+height-paddingTop-headHeight)/stride)+bufferRows));
    const wanted = entries.slice(start*columns,end*columns);
    const keys = new Set(wanted.map(entry=>entry.key));

})();

// NovelAI Media Library hotfix layer v2.3.0
(() => {
  'use strict';

  const API = 'http://127.0.0.1:8765';
  const host = document.getElementById('nai-media-host');
  const root = host?.shadowRoot;
  if (!root || root.getElementById('nai-media-v230-patch')) return;

  const style = document.createElement('style');
  style.id = 'nai-media-v230-patch';
  style.textContent = `
    .viewer { position:relative !important; }
    .stages.split { position:absolute !important; inset:0 !important; gap:2px !important; z-index:1 !important; }
    .stages.split .stage { flex:1 1 50% !important; min-height:0 !important; }
    .stages.split ~ .viewerNav {
      position:absolute !important; left:50% !important; bottom:6px !important;
      transform:translateX(-50%) !important; z-index:4 !important;
      padding:4px 6px !important; border-radius:10px !important;
      background:rgba(11,13,29,.78) !important; backdrop-filter:blur(4px) !important;
    }
    .stages.split ~ .badgeRow,
    .stages.split ~ .viewerMeta { display:none !important; }
    .stages.split ~ .videoTools.visible {
      position:absolute !important; left:5px !important; right:5px !important; bottom:50px !important;
      z-index:4 !important; padding:6px !important; border-radius:9px !important;
      background:rgba(11,13,29,.82) !important; backdrop-filter:blur(4px) !important;
    }
  `;
  root.appendChild(style);

  function gmRequest({ method = 'GET', path, data = null, headers = {}, responseType = 'text', timeout = 300000 }) {
    return new Promise((resolve, reject) => {
      GM_xmlhttpRequest({
        method,
        url: `${API}${path}`,
        data,
        headers: { Origin: 'https://novelai.net', ...headers },
        responseType,
        timeout,
        onload: res => {
          if (res.status >= 200 && res.status < 300) {
            if (responseType === 'blob') return resolve(res.response);
            const text = res.responseText || '';
            if (!text) return resolve(null);
            try { resolve(JSON.parse(text)); } catch (_) { resolve(text); }
            return;
          }
          let message = `Request failed (${res.status})`;
          try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
          reject(new Error(message));
        },
        onerror: () => reject(new Error('Could not connect to the local NovelAI Media Library program.')),
        ontimeout: () => reject(new Error('The local media request timed out.')),
      });
    });
  }

  function activeVideo() {
    return root.querySelector('.stage.slot-active video') || root.querySelector('.stage:not(.hidden) video');
  }

  function activeMediaId() {
    return root.querySelector('.tile.active')?.dataset?.id || null;
  }

  function waitForVideoEvent(video, event, timeout = 30000) {
    return new Promise((resolve, reject) => {
      let timer;
      const cleanup = () => {
        clearTimeout(timer);
        video.removeEventListener(event, done);
        video.removeEventListener('error', failed);
      };
      const done = () => { cleanup(); resolve(); };
      const failed = () => { cleanup(); reject(new Error('Could not load the video frame for thumbnail capture.')); };
      timer = setTimeout(() => { cleanup(); reject(new Error(`Timed out waiting for video ${event}.`)); }, timeout);
      video.addEventListener(event, done, { once: true });
      video.addEventListener('error', failed, { once: true });
    });
  }

  async function captureFrameFromBlob(mediaId, seconds) {
    const sourceBlob = await gmRequest({ path: `/api/media/${mediaId}/original`, responseType: 'blob' });
    const sourceUrl = URL.createObjectURL(sourceBlob);
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    video.src = sourceUrl;
    try {
      if (video.readyState < 1) await waitForVideoEvent(video, 'loadedmetadata');
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      const target = duration > 0
        ? Math.min(Math.max(0, seconds), Math.max(0, duration - 0.01))
        : Math.max(0, seconds);
      if (Math.abs(video.currentTime - target) > 0.001) {
        video.currentTime = target;
        await waitForVideoEvent(video, 'seeked');
      } else if (video.readyState < 2) {
        await waitForVideoEvent(video, 'loadeddata');
      }
      if (!video.videoWidth || !video.videoHeight) throw new Error('Video frame is not ready yet.');
      const maxSide = 960;
      const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Could not capture this video frame.');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return await new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not create thumbnail image.')), 'image/jpeg', 0.9);
      });
    } finally {
      video.pause();
      video.removeAttribute('src');
      video.load();
      URL.revokeObjectURL(sourceUrl);
    }
  }

  root.addEventListener('click', async event => {
    const thumbButton = event.target.closest?.('#setThumbBtn');
    if (thumbButton) {
      event.preventDefault();
      event.stopImmediatePropagation();
      const video = activeVideo();
      const mediaId = activeMediaId();
      if (!video || !mediaId) return;
      thumbButton.disabled = true;
      thumbButton.textContent = 'Saving thumbnail…';
      try {
        const seconds = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        const frameBlob = await captureFrameFromBlob(mediaId, seconds);
        await gmRequest({
          method: 'POST',
          path: `/api/media/${mediaId}/thumbnail?seconds=${encodeURIComponent(seconds)}`,
          headers: { 'Content-Type': 'image/jpeg' },
          data: frameBlob,
        });
        // Clear the old thumb object URL so the existing UI reloads the newly saved frame.
        const activeTile = root.querySelector(`.tile[data-id="${mediaId}"] img[data-mid]`);
        if (activeTile) activeTile.removeAttribute('src');
        thumbButton.textContent = 'Thumbnail saved';
        const refresh = root.querySelector('#refreshBtn');
        if (refresh) refresh.click();
      } catch (err) {
        alert(err?.message || String(err));
        thumbButton.textContent = 'Set thumbnail to current frame';
      } finally {
        setTimeout(() => {
          if (thumbButton.isConnected) {
            thumbButton.disabled = false;
            if (thumbButton.textContent === 'Thumbnail saved') thumbButton.textContent = 'Set thumbnail to current frame';
          }
        }, 700);
      }
      return;
    }

    const seekButton = event.target.closest?.('[data-seek-marker]');
    if (seekButton) {
      const video = activeVideo();
      if (!video) return;
      const wasPaused = video.paused;
      if (wasPaused) {
        // Let the existing handler perform the exact saved seek, then restore the prior paused state.
        setTimeout(() => { if (video.isConnected) video.pause(); }, 0);
      }
    }
  }, true);
})();

    if (source.tagName === 'VIDEO') {

      const wasPlaying = !source.paused;

      video.dataset.naiSplitFull = '1';

            : startTime;

// NovelAI Media Library v2.3.6: right-panel alignment + reliable video thumbnail refresh
(() => {
  'use strict';

  const API = 'http://127.0.0.1:8765';
  const host = document.getElementById('nai-media-host');
  const root = host?.shadowRoot;
  if (!root || document.documentElement.dataset.naiMediaV236 === '1') return;
  document.documentElement.dataset.naiMediaV236 = '1';

  // From the user's 2048px-wide screenshot, NovelAI's story scrollbar sits at ~1470px.
  // 72.1vw places the media panel only a few pixels to its right, matching the small
  // gap between the left media panel and the start of the story text.
  const style = document.createElement('style');
  style.id = 'nai-media-v236-style';
  style.textContent = `
    :host { --nai-right-edge: 72.1vw !important; }
  `;
  root.appendChild(style);

  function gmRequest({ method = 'GET', path, data = null, headers = {}, responseType = 'text', timeout = 300000 }) {
    return new Promise((resolve, reject) => {
      GM_xmlhttpRequest({
        method,
        url: `${API}${path}`,
        data,
        headers: { Origin: 'https://novelai.net', ...headers },
        responseType,
        timeout,
        onload: res => {
          if (res.status >= 200 && res.status < 300) {
            if (responseType === 'blob') return resolve(res.response);
            const text = res.responseText || '';
            if (!text) return resolve(null);
            try { resolve(JSON.parse(text)); } catch (_) { resolve(text); }
            return;
          }
          let message = `Request failed (${res.status})`;
          try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
          reject(new Error(message));
        },
        onerror: () => reject(new Error('Could not connect to the local NovelAI Media Library program.')),
        ontimeout: () => reject(new Error('The local media request timed out.')),
      });
    });
  }

  function waitFor(video, eventName, timeout = 30000) {
    return new Promise((resolve, reject) => {
      let timer = 0;
      const cleanup = () => {
        clearTimeout(timer);
        video.removeEventListener(eventName, done);
        video.removeEventListener('error', failed);
      };
      const done = () => { cleanup(); resolve(); };
      const failed = () => { cleanup(); reject(new Error('Could not load the video frame for thumbnail capture.')); };
      timer = setTimeout(() => {
        cleanup();
        reject(new Error(`Timed out waiting for video ${eventName}.`));
      }, timeout);
      video.addEventListener(eventName, done, { once: true });
      video.addEventListener('error', failed, { once: true });
    });
  }

  async function captureFrame(mediaId, seconds) {
    const sourceBlob = await gmRequest({ path: `/api/media/${mediaId}/original`, responseType: 'blob' });
    const sourceUrl = URL.createObjectURL(sourceBlob);
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    video.src = sourceUrl;

    try {
      if (video.readyState < 1) await waitFor(video, 'loadedmetadata');
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      const target = duration > 0
        ? Math.min(Math.max(0, seconds), Math.max(0, duration - 0.01))
        : Math.max(0, seconds);

      if (Math.abs(video.currentTime - target) > 0.001) {
        video.currentTime = target;
        await waitFor(video, 'seeked');
      } else if (video.readyState < 2) {
        await waitFor(video, 'loadeddata');
      }

      if (!video.videoWidth || !video.videoHeight) throw new Error('Video frame is not ready yet.');
      const maxSide = 960;
      const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Could not capture this video frame.');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      return await new Promise((resolve, reject) => {
        canvas.toBlob(
          blob => blob ? resolve(blob) : reject(new Error('Could not create thumbnail image.')),
          'image/jpeg',
          0.9
        );
      });
    } finally {
      video.pause();
      video.removeAttribute('src');
      video.load();
      URL.revokeObjectURL(sourceUrl);
    }
  }

  function activeVideo() {
    return root.querySelector('.stage.slot-active video') || root.querySelector('.stage:not(.hidden) video');
  }

  function mediaIdForVideo(video) {
    if (video) {
      const source = String(video.currentSrc || video.src || '');
      const match = source.match(/\/api\/media\/([0-9a-f]+)\/original(?:$|[?#])/i);
      if (match?.[1]) return match[1];
    }
    return root.querySelector('.tile.active')?.dataset?.id || null;
  }

  // The base UI keeps thumbnail object URLs in an internal cache. Updating the file on
  // disk alone can therefore leave the old frame on-screen until a full page reload.
  // Keep a tiny override cache for thumbnails changed during this page session and apply
  // the exact JPEG blob we just saved, so the new frame is visible immediately.
  const changedThumbUrls = new Map();

  function applyChangedThumb(mediaId) {
    const url = changedThumbUrls.get(mediaId);
    if (!url) return;
    const tile = root.querySelector(`.tile[data-id="${mediaId}"]`);
    if (!tile) return;

    let img = tile.querySelector('img[data-mid]');
    if (!img) {
      img = document.createElement('img');
      img.loading = 'eager';
      img.dataset.mid = mediaId;
      tile.insertBefore(img, tile.firstChild);
    }
    if (img.src !== url) img.src = url;
    img.alt = '';
  }

  function rememberChangedThumb(mediaId, blob) {
    const old = changedThumbUrls.get(mediaId);
    if (old) URL.revokeObjectURL(old);
    const url = URL.createObjectURL(blob);
    changedThumbUrls.set(mediaId, url);
    applyChangedThumb(mediaId);
  }

  function reapplyChangedThumbsSoon() {
    if (!changedThumbUrls.size) return;
    setTimeout(() => {
      for (const mediaId of changedThumbUrls.keys()) applyChangedThumb(mediaId);
    }, 0);
  }

  // v2.3.0's thumbnail handler is on document capture and stops propagation. Window
  // capture runs first, so this safely replaces only that button behavior without a DOM
  // observer or any continuous work.
  window.addEventListener('click', async event => {
    const path = event.composedPath?.() || [];
    const button = path.find(node => node?.id === 'setThumbBtn');
    if (!button || !path.includes(host)) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    const video = activeVideo();
    const mediaId = mediaIdForVideo(video);
    if (!video || !mediaId) {
      alert('Could not determine which video is active. Select the video thumbnail again, then retry.');
      return;
    }

    button.disabled = true;
    button.textContent = 'Saving thumbnail…';
    try {
      const seconds = Number.isFinite(video.currentTime) ? video.currentTime : 0;
      const frameBlob = await captureFrame(mediaId, seconds);
      await gmRequest({
        method: 'POST',
        path: `/api/media/${mediaId}/thumbnail?seconds=${encodeURIComponent(seconds)}`,
        headers: { 'Content-Type': 'image/jpeg' },
        data: frameBlob,
      });

      // Use the exact frame blob just written instead of refetching through the old
      // in-page thumbnail cache.
      rememberChangedThumb(mediaId, frameBlob);
      button.textContent = 'Thumbnail saved';
    } catch (err) {
      alert(err?.message || String(err));
      button.textContent = 'Set thumbnail to current frame';
    } finally {
      setTimeout(() => {
        if (!button.isConnected) return;
        button.disabled = false;
        if (button.textContent === 'Thumbnail saved') button.textContent = 'Set thumbnail to current frame';
      }, 700);
    }
  }, true);

  // If the grid is rebuilt by changing category/character/search, put any thumbnail
  // changed during this session back on the newly-created tile.
  root.addEventListener('click', reapplyChangedThumbsSoon, false);
  root.addEventListener('change', reapplyChangedThumbsSoon, false);
  root.addEventListener('input', reapplyChangedThumbsSoon, false);

  window.addEventListener('beforeunload', () => {
    for (const url of changedThumbUrls.values()) URL.revokeObjectURL(url);
    changedThumbUrls.clear();
  }, { once: true });
})();

  root.appendChild(style);

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function gmRequest({method='GET', path, data=null, headers={}, responseType='text', timeout=120000}) {
    return new Promise((resolve, reject) => GM_xmlhttpRequest({
      method,
      url:`${API}${path}`,
      data,
      headers:{Origin:'https://novelai.net', ...headers},
      responseType,
      timeout,
      onload:res => {
        if (res.status >= 200 && res.status < 300) {
          if (responseType === 'blob') return resolve(res.response);
          const text = res.responseText || '';
          if (!text) return resolve(null);
          try { return resolve(JSON.parse(text)); } catch (_) { return resolve(text); }
        }
        let message = `Request failed (${res.status})`;
        try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
        reject(new Error(message));
      },
      onerror:()=>reject(new Error('Could not connect to the local NovelAI Media Library program.')),
      ontimeout:()=>reject(new Error('The local media request timed out.')),
    }));
  }

  async function refreshLibrary() {
    library = await gmRequest({path:'/api/library'});
    if (!Array.isArray(library?.sets)) library.sets = [];
    return library;
  }

  // Keep set collapsing and set-only navigation in sync with edits made from the
  // viewer, without waiting for a second manual refresh.
  root.naiSetsApplyLibrary216 = (snapshot, refresh=true) => {
    if (!snapshot) return;
    library = snapshot;
    if (!Array.isArray(library.sets)) library.sets = [];
    if(!refresh){ensureControls();return;}
    if (openSetId) renderOpenSet();
    else if (setsView) renderSetsView();
    else {
      ensureControls();
      collapseNormalGrid();
    }
  };

  function currentCharacter() {
    const id = charSelect.value || '';
    return (library?.characters || []).find(c => c.id === id) || null;
  }

  function mediaById(id) {
    return root.naiFindMedia(id,library);
  }

  function setsForCurrentCharacter() {
    const id = charSelect.value || '';
    return (library?.sets || []).filter(s => s.character_id === id && (s.kind || 'set') === 'set');
  }

  function setById(id) {
    const set=root.naiFindSet(id,library);return set && (set.kind || 'set')==='set' ? set : null;
  }

  root.naiViewerCollectionIds=()=>openSetId ? visibleSetIds(setById(openSetId)) : null;

  function availableSetIds(set) {
    const ids = (set?.media_ids || []).filter(id => {
      const m = mediaById(id);
      return m && m.character_id === set.character_id && !m.in_review;
    });
    const cover = ids.indexOf(set?.cover_media_id);
    if (cover > 0) ids.unshift(ids.splice(cover, 1)[0]);
    return ids;
  }

  function visibleSetIds(set){
    const q=String(searchInput.value || '').trim().toLowerCase();
    let items=availableSetIds(set).map(mediaById).filter(m=>!q || String(m.original_name || '').toLowerCase().includes(q));
    return (root.naiApplyCombinedFilters?.(items,library) || items).map(m=>m.id);
  }
  root.naiRefreshCollectionView=()=>{if(openSetId){renderOpenSet();return true;}if(setsView){renderSetsView();return true;}return false;};

  function baseCatButtons() {
    return [...catWrap.querySelectorAll('.cat:not(.naiSetsCat):not(.naiReviewCat270)')];
  }

  function currentCategoryKey() {
    return uiState().categoryId || 'all';
  }

  function buttonForCategoryKey(key) {
    const buttons = baseCatButtons();
    if (key === 'all') return buttons[0] || null;
    if (key === 'favorites') return buttons[1] || null;
    if (key === 'videos') return buttons[2] || null;
    return [...root.querySelectorAll('.cat[data-cat]')].find(b=>b.dataset.cat===key) || buttons[0] || null;
  }

  function uiState() {
    try { return JSON.parse(localStorage.getItem(UI_STATE_KEY) || '{}') || {}; }
    catch (_) { return {}; }
  }

  function activeSelectedMediaId() {
    const state = uiState();
    const activeSlot = state.activeSlot === 1 ? 1 : 0;
    const ids = Array.isArray(state.slotMediaIds) ? state.slotMediaIds : [];
    return ids[activeSlot] || state.selectedMediaId || null;
  }

  function revokeThumb(mediaId) {
    root.naiInvalidateThumbnail?.(mediaId);
    const old = thumbUrls.get(mediaId);
    if (old) URL.revokeObjectURL(old);
    thumbUrls.delete(mediaId);
  }
  root.naiInvalidateSetThumb = revokeThumb;

  async function loadThumb(mediaId,img,force=false){
    if(force)revokeThumb(mediaId);
    return root.naiLoadThumbnail(mediaId,img);
  }

  function createSetTile(set) {
    const tile = document.createElement('div');
    tile.className = 'naiSetTile';
    tile.dataset.setId = set.id;
    const published = availableSetIds(set);
    tile.dataset.coverId = published.includes(set.cover_media_id) ? set.cover_media_id : (published[0] || '');
    tile.title = `${labelOf(set)}: ${set.name} — ${counts(set)}`;

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    if (tile.dataset.coverId) {
      tile.appendChild(img);
      img.dataset.mid=tile.dataset.coverId;
      const cached=root.naiCachedThumbnail?.(tile.dataset.coverId);
      if(cached)img.src=cached;else root.naiObserveGridTile(tile);
    } else {
      const empty = document.createElement('div');
      empty.textContent = 'Empty set';
      empty.style.cssText = 'display:grid;place-items:center;height:100%;color:#a8abc4';
      tile.appendChild(empty);
    }

    const stack = document.createElement('div');
    stack.className = 'naiSetStack';
    stack.innerHTML = root.naiIconSvg('link');
    tile.appendChild(stack);

    const count = document.createElement('div');
    count.className = 'naiSetCount';
    count.textContent = counts(set);
    tile.appendChild(count);

    const caption = document.createElement('div');
    caption.className = 'naiSetCaption';
    caption.textContent = `${labelOf(set)}: ${set.name || 'Untitled'}`;
    tile.appendChild(caption);

    tile.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      openSet(set.id);
    });
    return tile;
  }

  function ensureControls() {
    root.naiSetFilterBrowserMode?.(setsView && !openSetId);
    for(const id of ['sortSelect','sortDirectionBtn'])root.getElementById(id)?.classList.toggle('hidden',setsView && !openSetId);
    if (!library) return;
    // Both media modes share the same collection browser.
    const selectedCharacter = charSelect.value;
    const suppressSets = selectedCharacter === '__nai_featured__' || selectedCharacter === '__nai_featured_videos__';

    let setsButton = root.getElementById('naiSetsCat');
    if (!setsButton) {
      setsButton = document.createElement('button');
      setsButton.type = 'button';
      setsButton.id = 'naiSetsCat';
      setsButton.className = 'cat naiSetsCat';
      setsButton.addEventListener('click', event => {
        event.preventDefault();
        event.stopImmediatePropagation();
        openSetId = null;
        setsView = true;
        renderSetsView();
      });
      const buttons = baseCatButtons();
      const anchor = buttons[2]?.nextSibling || null;
      catWrap.insertBefore(setsButton, anchor);

    setsButton.innerHTML = `${root.naiIconSvg?.('link') || ''} Sets ${setsForCurrentCharacter().length}`;
    setsButton.classList.toggle('hidden', suppressSets);
    setsButton.classList.toggle('active', setsView && !openSetId);
    if (setsView && !openSetId) baseCatButtons().forEach(b => b.classList.remove('active'));

    if (!root.getElementById('naiManageSetsBtn')) {
      const manage = document.createElement('button');

      const random = root.getElementById('randomBtn');
      if (random) toolbar.insertBefore(manage, random);
      else toolbar.appendChild(manage);
    }
    root.getElementById('naiManageSetsBtn')?.classList.toggle('hidden', suppressSets);
  }
  root.naiSyncSetsVisibility = ensureControls;

  function visibleCollections() {
    const q=String(searchInput.value || '').trim().toLowerCase(),stats=new Map();
    let sets=setsForCurrentCharacter().filter(s=>{
      const count=collectionStats(s);stats.set(s.id,count);
      if(videoPresence==='yes' && !count.videos || videoPresence==='no' && count.videos)return false;
      return !q || String(s.name || '').toLowerCase().includes(q) || (s.media_ids || []).some(id=>String(mediaById(id)?.original_name || '').toLowerCase().includes(q));
    });
    const name=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'});
    if(collectionSort==='images-desc')sets.sort((a,b)=>stats.get(b.id).images-stats.get(a.id).images || name(a,b));
    if(collectionSort==='images-asc')sets.sort((a,b)=>stats.get(a.id).images-stats.get(b.id).images || name(a,b));
    if(collectionSort==='name')sets.sort(name);
    return sets;
  }

  function renderSetsView() {
    if (!library) return;
    openSetId = null;
    setsView = true;
    ensureControls();
    baseCatButtons().forEach(b => b.classList.remove('active'));
    root.getElementById('naiSetsCat')?.classList.add('active');

    const q = String(searchInput.value || '').trim().toLowerCase();
    const sets = visibleCollections();

    const head=document.createElement('div'); head.className='naiSetBreadcrumb';head.style.flexWrap='wrap';
    const controls=document.createElement('div');controls.style.cssText='display:flex;gap:6px;flex:1 0 100%;min-width:0';
    const addSelect=(id,label,choices,value,change)=>{

      for(const [v,text] of choices){const o=document.createElement('option');o.value=v;o.textContent=text;select.appendChild(o);}select.value=value;select.onchange=()=>{change(select.value);renderSetsView();};controls.appendChild(select);
    };

    addSelect('naiSetSort','Sort collections',[['default','Default order'],['images-desc','Most images first'],['images-asc','Fewest images first'],['name','Name A–Z']],collectionSort,value=>collectionSort=value);
    head.appendChild(controls);
    const empty=document.createElement('div'); empty.className='empty';

    root.naiVirtualGrid.render(`sets:${charSelect.value}:${videoPresence}:${collectionSort}:${q}`,sets.map(set=>({key:'set:'+set.id,value:set})),{create:entry=>createSetTile(entry.value),empty,header:head,headerKey:`${videoPresence}:${collectionSort}`});
  }

  root.naiCreateSetTile = createSetTile;
  // Normal categories always show individual files; collection cards belong

  function renderOpenSet() {
    if (!library || !openSetId) return;
    const set = setById(openSetId);
    if (!set) {
      openSetId = null;
      returnToPreviousView();
      return;
    }

    ensureControls();
    root.getElementById('naiSetsCat')?.classList.remove('active');

    const ids = visibleSetIds(set);
    const head = document.createElement('div');
    head.className = 'naiSetBreadcrumb';
    head.innerHTML = `
      <button type="button" id="naiSetBackBtn">← Back</button>
      <div class="naiSetTitle">${labelOf(set)}: ${escapeHtml(set.name || 'Untitled')} · ${counts(set)}</div>
      <button type="button" id="naiSetEditBtn">Edit ${labelOf(set)}</button>

    head.querySelector('#naiSetBackBtn')?.addEventListener('click', event => {
      event.preventDefault(); event.stopPropagation(); returnToPreviousView();

    head.querySelector('#naiSetEditBtn')?.addEventListener('click', event => {

    const decorate = tile => {
      let cover = tile.querySelector('.naiSetCover216');
      if (!cover) {
        cover = document.createElement('button');

        cover.className = 'naiSetCover216';

          event.preventDefault(); event.stopPropagation();
          if (coverSaving) return;
          coverSaving = true;
          grid.querySelectorAll('.naiSetCover216').forEach(button => button.disabled = true);
          try {
            const updated = await gmRequest({method:'POST',path:`/api/sets/${encodeURIComponent(set.id)}`,
              headers:{'Content-Type':'application/json'},data:JSON.stringify({cover_media_id:tile.dataset.id})});
            library.sets = library.sets.map(item => item.id === updated.id ? updated : item);
          } catch (err) { alert(err?.message || String(err)); }
          finally {
            coverSaving = false;
            if (openSetId === set.id) renderOpenSet();
          }
        });
        tile.appendChild(cover);
      }
      const chosen = tile.dataset.id === set.cover_media_id;
      cover.innerHTML = root.naiIconSvg('pin');
      let main=tile.querySelector('.naiMainBadge');
      const m=mediaById(tile.dataset.id);
      if(m && (m.media_type==='video' ? m.in_videos!==false : m.in_all!==false)) { if(!main){main=document.createElement('span');main.className='naiMainBadge';main.innerHTML=root.naiIconSvg('home');main.title=m.media_type==='video'?'Also in main Videos':'Also in main Images';tile.appendChild(main);} } else main?.remove();
      if(m?.media_type==='video') {
        tile.classList.add('naiCollectionVideo');
        if(!tile.querySelector('.naiVideoBadge')){const badge=document.createElement('span');badge.className='naiVideoBadge';badge.innerHTML=root.naiIconSvg('play');badge.title='Video';badge.setAttribute('aria-label','Video');tile.appendChild(badge);}
      }

    root.naiRenderSetMedia216(library,shown,{
      key:`set:${set.id}:${q}:${root.naiCombinedFilterKey?.() || ''}`, header:head, headerKey:`${set.id}:${set.name}:${ids.length}`,
      decorationKey:`${set.id}:${set.cover_media_id}:${coverSaving}`,decorate,empty,
    });

  function filterOpenSetBySearch() { renderOpenSet(); }

  function updateSetCounter() {
    if (!openSetId || !counter) return;
    const set = setById(openSetId);
    if (!set) return;
    const id = activeSelectedMediaId();
    const ids = visibleSetIds(set);
    const idx = ids.indexOf(id);
    counter.textContent = idx >= 0 ? `${idx + 1} / ${ids.length}` : `— / ${ids.length}`;
  }

  // The base viewer updates its category-relative counter again after an original
  // finishes loading. Keep the counter set-relative while a set is open. This is
  // deliberately scoped to the one counter node, not the page or media grid.
  const setCounterObserver = counter ? new MutationObserver(() => {
    if (!openSetId) return;
    const set = setById(openSetId);
    if (!set) return;
    const ids = visibleSetIds(set);
    const idx = ids.indexOf(activeSelectedMediaId());
    const expected = idx >= 0 ? `${idx + 1} / ${ids.length}` : `— / ${ids.length}`;
    if (counter.textContent !== expected) counter.textContent = expected;
  }) : null;
  setCounterObserver?.observe(counter, {childList:true, characterData:true, subtree:true});

  function clickCategoryKey(key) {
    const button = buttonForCategoryKey(key);
    if (!button) return;
    internalNavigation = true;
    try { button.click(); }
    finally { internalNavigation = false; }
  }

  root.naiOpenGroup = openSet;
  root.naiOpenGroupManager = openSetManager;
  root.naiOpenGroupId = () => openSetId;
  async function openSet(setId) {
    const characterId = charSelect.value;
    try { await refreshLibrary(); } catch (err) { alert(err?.message || String(err)); return; }
    if (charSelect.value !== characterId) return;
    const set = setById(setId);
    if (!set) return;
    root.naiPrepareGroupOwner?.(library,set.character_id);
    returnView = {
      categoryKey: setsView ? 'sets' : currentCategoryKey(),
      search: String(searchInput.value || ''),
    };
    openSetId = setId;
    setsView = false;

    internalSearch = true;
    try {
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input', {bubbles:true, composed:true}));
    } finally {
      internalSearch = false;
    }
    renderOpenSet();

  }

  function returnToPreviousView() {
    const previous = returnView || {categoryKey:'all', search:''};
    openSetId = null;
    if (previous.categoryKey === 'sets') {
      setsView = true;
      searchInput.value = previous.search || '';
      renderSetsView();
      return;
    }
    setsView = false;
    clickCategoryKey(previous.categoryKey || 'all');
    searchInput.value = previous.search || '';
    searchInput.dispatchEvent(new Event('input', {bubbles:true, composed:true}));
    scheduleSync(false, 0);
  }

  function selectSetRelative(delta) {
    const set = setById(openSetId);
    const ids = visibleSetIds(set);
    if (!ids.length) return;
    const current = activeSelectedMediaId();
    let idx = ids.indexOf(current);
    if (idx < 0) idx = 0;
    idx = (idx + delta + ids.length) % ids.length;
    root.naiSelectMedia(ids[idx]);
    updateSetCounter();
  }

  function selectRandomSetMember() {
    const set = setById(openSetId);
    const ids = visibleSetIds(set);
    if (!ids.length) return;
    const id = ids[Math.floor(Math.random() * ids.length)];
    root.naiSelectMedia(id);
    updateSetCounter();
  }

  function selectRandomCollectionMember() {
    let ids = [...new Set(visibleCollections().flatMap(availableSetIds))];
    if (ids.length > 1) ids = ids.filter(id => id !== activeSelectedMediaId());
    if (!ids.length) return;
    root.naiPrepareGroupOwner(library, charSelect.value);
    root.naiSelectMedia(ids[Math.floor(Math.random() * ids.length)]);
    // Keep the collection browser open so another Random uses the same pool.
  }

  async function syncUI(forceRefresh=false) {
    syncQueued = false;
    try {
      if (forceRefresh || !library) await refreshLibrary();
    } catch (_) {
      return;
    }
    ensureControls();
    if (openSetId) renderOpenSet();
    else if (setsView) renderSetsView();
    else collapseNormalGrid();
  }

  function scheduleSync(forceRefresh=false, delay=0) {
    refreshQueued = refreshQueued || forceRefresh;
    if (syncQueued && delay === 0) return;
    syncQueued = true;
    setTimeout(() => {
      const refresh = refreshQueued;
      refreshQueued = false;
      syncUI(refresh);
    }, delay);
  }

  function setMembershipMap() {
    const map = new Map();
    for (const set of setsForCurrentCharacter()) {
      for (const id of (set.media_ids || [])) map.set(id, set);
    }
    return map;
  }

  async function openSetManager(initialSetId=null, initialIds=[]) {

  async function captureDisplayedVideoFrame(video) {
    if (!video?.videoWidth || !video?.videoHeight) throw new Error('Video frame is not ready yet.');
    const maxSide = 960;
    const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('Could not capture this video frame.');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    return await new Promise((resolve, reject) => canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error('Could not create thumbnail image.')),
      'image/jpeg', 0.9
    ));
  }

  async function uploadFileChunked(file, characterId, categories, sourceUrl='') {
    const token = importToken274();
    const chunkSize = 16 * 1024 * 1024;
    const started = performance.now();
    let canceled = false, requestHandle = null, rejectPending = null, cleanupStarted = false;
    const checkCanceled = () => { if (canceled) throw new Error('Import canceled'); };
    const cleanup = () => {
      if (cleanupStarted) return;
      cleanupStarted = true;
      gmRequest({method:'POST', path:`/api/import/chunked/${token}/cancel`,
        headers:{'Content-Type':'application/json'}, data:'{}', timeout:15000})
        .catch(() => console.warn('[NovelAI Media] Temporary upload cleanup deferred until companion restart.'));
    };
    const control = {abort() {
      if (canceled) return;
      canceled = true;
      rejectPending?.(new Error('Import canceled'));
      try { requestHandle?.abort?.(); } catch (_) {}
      cleanup();
    }};
    activeUploadHandle = control;
    const progress = message => {
      if (canceled || activeUploadHandle !== control) return;
      let el = modalRoot.querySelector('#naiUploadProgress253');
      if (!el) {
        const side = modalRoot.querySelector('.reviewSide');
        if (side) {
          el = document.createElement('div'); el.id = 'naiUploadProgress253';
          el.className = 'muted'; el.setAttribute('role','status');
          el.style.marginTop = '10px'; side.appendChild(el);
        } else el = modalRoot.querySelector('#importStatus');
      }
      if (el) el.textContent = message;
    };
    const request = (path, body, timeout=30000) => new Promise((resolve, reject) => {
      checkCanceled();
      let settled = false;
      const finish = (err, value) => {
        if (settled) return;
        settled = true; clearTimeout(timer); rejectPending = null;
        if (err) reject(err); else resolve(value);
      };
      const timer = setTimeout(() => {
        const error = new Error('The import stopped responding. You can retry Save or use X to skip this file.');
        error.retryable = true;
        finish(error);
        try { requestHandle?.abort?.(); } catch (_) {}
      }, timeout);
      rejectPending = err => finish(err);
      const fail = message => {
        const error = new Error(message); error.retryable = true; finish(error);
      };
      try {
        requestHandle = GM_xmlhttpRequest({method:body === null ? 'GET' : 'POST', url:`${API}${path}`,
          headers:{Origin:'https://novelai.net', 'Content-Type':'application/json'},
          data:body === null ? null : JSON.stringify(body), timeout,
          onload:res => {
            let value;
            try { value = JSON.parse(res.responseText || '{}'); }
            catch (_) { fail('The companion returned an invalid upload response.'); return; }
            if (res.status >= 200 && res.status < 300) finish(null, value);
            else {
              const error = new Error(value.error || `Upload failed (${res.status})`);
              error.retryable = res.status === 0 || res.status >= 500;
              finish(error);
            }
          },
          onerror:()=>fail('Could not reach the local companion during import.'),
          ontimeout:()=>fail('The upload step timed out. Retry Save or use X to skip this file.'),
          onabort:()=>finish(new Error('Import canceled')),
        });
      } catch (err) { finish(err); }
    });
    const post = async (action, body, timeout=30000) => {
      for (let attempt=0; ; attempt++) {
        checkCanceled();
        try { return await request(`/api/import/chunked/${token}/${action}`, body, timeout); }
        catch (err) { if (canceled || !err.retryable || attempt >= 1) throw err; }
      }
    };
    try {
      progress('Preparing upload…');
      if (!chunkUploadsAvailable) {
        const health = await request('/api/health', null);
        checkCanceled();
        if (!health?.chunked_uploads) throw new Error('Restart the companion to install the update for larger file imports, then retry Save.');
        chunkUploadsAvailable = true;
      }
      const ready = await post('start', {character_id:characterId, filename:file.name || 'upload',
        size:file.size, content_type:file.type || '', categories:Array.isArray(categories) ? categories : [], source_url:sourceUrl});
      let offset = ready.offset;
      if (!Number.isSafeInteger(offset) || offset < 0 || offset > file.size) throw new Error('Invalid upload position from companion.');
      while (offset < file.size) {
        checkCanceled();
        progress(`Saving ${formatBytes(offset)} / ${formatBytes(file.size)} (${Math.floor(offset/file.size*100)}%)…`);
        const bytes = new Uint8Array(await file.slice(offset, offset + chunkSize).arrayBuffer());
        checkCanceled();
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        checkCanceled();
        const sha256 = [...new Uint8Array(digest)].map(x => x.toString(16).padStart(2,'0')).join('');
        const pieces = [];
        for (let i=0; i<bytes.length; i+=32768) pieces.push(String.fromCharCode(...bytes.subarray(i,i+32768)));
        const data = btoa(pieces.join(''));
        const result = await post('chunk', {offset, data, sha256});
        if (result.offset !== offset + bytes.length) throw new Error('Companion acknowledged an unexpected upload position.');
        offset = result.offset;
      }
      checkCanceled();
      progress('Upload complete. Checking and saving file…');
      const result = await post('finish', {}, 120000);
      checkCanceled();
      if (!result?.item?.id) throw new Error('The companion did not confirm the saved file.');
      console.info(`[NovelAI Media timing] chunked import response: ${Math.round(performance.now()-started)} ms`);
      progress('File saved. Updating categories…');
      return result;
    } catch (err) {
      cleanup();
      progress(err?.message || 'Import failed.');
      throw err;
    } finally {
      if (activeUploadHandle === control) activeUploadHandle = null;
    }
  }

  async function uploadFileResilient(file, characterId, categories, sourceUrl='') {
    if (file.size > 8 * 1024 * 1024) return uploadFileChunked(file, characterId, categories, sourceUrl);
    // Small files retain the single-request path; larger files must stay below the
    // browser extension message cap by using bounded, ASCII-encoded chunks.
    const form = new FormData();
    form.append('character_id', characterId);
    form.append('categories', JSON.stringify(Array.isArray(categories) ? categories : []));
    form.append('file', file, file.name || 'upload');
    if (sourceUrl) form.append('source_url', sourceUrl);
    const started = performance.now();
    return await new Promise((resolve, reject) => {
      activeUploadHandle = GM_xmlhttpRequest({
        method:'POST',
        url:`${API}/api/import/file`,
        data:form,
        // A stuck companion request must not permanently lock Rapid Review.  Users can
        // also close a save in progress, which aborts this request and restores controls.
        timeout:90000,
        headers:{Origin:'https://novelai.net'},
        onload:res => {
          activeUploadHandle = null;
          const elapsed = Math.round(performance.now() - started);
          console.info(`[NovelAI Media timing] local import response: ${elapsed} ms`);
          if (res.status >= 200 && res.status < 300) {
            try { resolve(JSON.parse(res.responseText || '{}')); }
            catch (_) { resolve(null); }
            return;
          }
          let message = `Request failed (${res.status})`;
          try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
          reject(new Error(message));
        },
        onerror:()=>{
          activeUploadHandle = null;
          reject(new Error(importCancel ? 'Import canceled' : 'Could not connect to the local NovelAI Media Library program.'));
        },
        ontimeout:()=>{
          activeUploadHandle = null;
          reject(new Error(importCancel ? 'Import canceled' : 'The local media request timed out.'));
        },
        onabort:()=>{
          activeUploadHandle = null;
          reject(new Error('Import canceled'));
        },
      });
    });
  }

  async function uploadUrlResilient(url, characterId, categories) {
    const before = library || await refreshLibrary();
    const beforeIds = new Set((before.media || []).map(m => m.id));
    const beforeItem = (before.media || []).find(m =>
      m.character_id === characterId && m.source?.kind === 'url' && m.source?.url === url
    ) || null;
    let requestReject = null;
    const requestPromise = new Promise((resolve, reject) => {
      activeUploadHandle = GM_xmlhttpRequest({
        method:'POST', url:`${API}/api/import/url`, timeout:300000,
        headers:{Origin:'https://novelai.net','Content-Type':'application/json'},
        data:JSON.stringify({character_id:characterId, categories, url}),
        onload:res => {
          activeUploadHandle = null;
          if (res.status >= 200 && res.status < 300) {
            try { resolve(JSON.parse(res.responseText || '{}')); } catch (_) { resolve(null); }
          } else {
            let message = `Request failed (${res.status})`;
            try { message = JSON.parse(res.responseText || '{}').error || message; } catch (_) {}
            reject(new Error(message));
          }
        },
        onerror:()=>{ activeUploadHandle = null; reject(new Error(importCancel ? 'Import canceled' : 'Could not connect to the local NovelAI Media Library program.')); },
        ontimeout:()=>{ activeUploadHandle = null; reject(new Error(importCancel ? 'Import canceled' : 'The local media request timed out.')); },
      });
    }).catch(err => { requestReject = err; return null; });
    const confirmPromise = confirmImportedUrl(characterId, url, beforeIds, categories, beforeItem).catch(() => null);
    while (!importCancel) {
      const winner = await Promise.race([
        requestPromise.then(value => ({source:'request', value})),
        confirmPromise.then(value => ({source:'confirm', value})),
      ]);
      if (winner.value?.item?.id) {
        if (winner.source === 'confirm' && activeUploadHandle?.abort) {
          try { activeUploadHandle.abort(); } catch (_) {}
          activeUploadHandle = null;
        }
        return winner.value;
      }
      const other = winner.source === 'request' ? await confirmPromise : await requestPromise;
      if (other?.item?.id) return other;
      break;
    }
    if (importCancel) throw new Error('Import canceled');
    throw requestReject || new Error('The URL import could not be confirmed.');
  }

  async function runOwnImport(reviewAfter) {
    if (importBusy) return;

    const isUrl = !modalRoot.querySelector('#urlPane')?.classList.contains('hidden');
    const urls = isUrl ? String(modalRoot.querySelector('#urlInput')?.value || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean) : [];
    const jobs = isUrl ? urls.map(url => ({kind:'url', url})) : orderedReviewFiles(mirroredFiles).map(file => ({kind:'file', file}));
    const status = modalRoot.querySelector('#importStatus');
    const progress = modalRoot.querySelector('#importProgress');
    const bar = progress?.firstElementChild;
    if (!jobs.length) {
      if (status) { status.textContent = 'Choose at least one file or URL.'; status.classList.add('bad'); }
      return;
    }

    importBusy = true;
    importCancel = false;
    const categories = importSelectedCategories();
    const characterId = currentCharacterId();
    if (reviewAfter) {
      try {
        const ids = [];
        // Files stay in the browser. URL previews use a temporary download, never registration.
        for (const job of jobs) {
          if (importCancel) break;
          if (status) status.textContent = `Preparing preview ${ids.length + 1} of ${jobs.length}…`;
          const file = job.kind === 'file' ? job.file : await downloadUrlPreview(job.url);
          if (importCancel) break;
          ids.push(addReviewDraft(file, characterId, categories, job.url || ''));
        }
        if (!importCancel && ids.length) {
          mirroredFiles = [];
          await openReviewQueue(ids, 'import');
        } else discardReviewDrafts();
      } catch (err) {
        discardReviewDrafts();
        throw err;
      } finally { importBusy = false; activeUploadHandle = null; }
      return;
    }
    const importedIds = [];
    const errors = [];
    progress?.classList.remove('hidden','indeterminate');
    if (bar) bar.style.width = '0%';
    modalRoot.querySelectorAll('button,input,textarea').forEach(el => { if (!el.matches('[data-close]')) el.disabled = true; });
    modalRoot.querySelectorAll('[data-close]').forEach(el => { el.disabled = false; });

    const oldCancel = modalRoot.querySelector('#importCancelBtn');
    const cancel = oldCancel?.cloneNode(true);
    if (oldCancel && cancel) {
      cancel.removeAttribute('data-close');
      cancel.disabled = false;
      cancel.textContent = 'Cancel Import';
      oldCancel.replaceWith(cancel);
      cancel.addEventListener('click', event => {
        event.preventDefault();
        importCancel = true;
        try { activeUploadHandle?.abort?.(); } catch (_) {}
        activeUploadHandle = null;
        if (status) status.textContent = 'Canceling import…';
        setTimeout(() => {
          if (modalRoot.querySelector('#fileDropZone')) modalRoot.innerHTML = '';
          refreshBtn?.click();
          schedulePseudoSync();
          scheduleMainFilter();
        }, 0);
      });
    }

    if (status) {
      status.classList.remove('bad');
      status.textContent = `Starting import of ${jobs.length} item${jobs.length === 1 ? '' : 's'}…`;
    }

    try {
      // Do not refresh the entire library here. In 2.7.4 this request could stall
      // before the upload even started, producing the exact blank-status screen.
      for (let i = 0; i < jobs.length; i++) {
        if (importCancel) break;
        const job = jobs[i];
        if (status) {
          status.classList.remove('bad');
          status.textContent = `Importing ${i + 1} of ${jobs.length}… ${job.kind === 'file' ? job.file.name : job.url}`;
        }
        if (bar) bar.style.width = `${Math.round((i / jobs.length) * 100)}%`;
        try {
          const result = job.kind === 'file'
            ? await uploadFileResilient(job.file, characterId, categories)
            : await uploadUrlResilient(job.url, characterId, categories);
          if (result?.item?.id) {
            if (!importedIds.includes(result.item.id)) importedIds.push(result.item.id);
            if (library && Array.isArray(library.media)) {
              const existingIndex = library.media.findIndex(m => m.id === result.item.id);
              if (existingIndex >= 0) library.media[existingIndex] = result.item;
              else library.media.push(result.item);
            }
          }
        } catch (err) {
          if (importCancel) break;
          errors.push(`${job.kind === 'file' ? job.file.name : job.url}: ${err?.message || err}`);
        }
      }
      if (bar) bar.style.width = '100%';

      if (importCancel) {
        if (status) status.textContent = `Import canceled. Imported ${importedIds.length} item(s).`;
        return;
      }
      if (status) status.textContent = `Imported ${importedIds.length} item(s)${errors.length ? `; ${errors.length} failed` : ''}.`;
      if (errors.length) console.warn('[NovelAI Media] import errors', errors);

      if (reviewAfter && importedIds.length) {
        mirroredFiles = [];
        const reviewStarted = performance.now();
        modalRoot.innerHTML = '';
        await openReviewQueue(importedIds, 'import');
        console.info(`[NovelAI Media timing] Rapid Review opened: ${Math.round(performance.now() - reviewStarted)} ms`);
      } else if (importedIds.length || !errors.length) {
        mirroredFiles = [];
        setTimeout(() => {
          modalRoot.innerHTML = '';
          refreshBtn?.click();
          schedulePseudoSync();
          scheduleMainFilter();
        }, 300);
      } else {
        modalRoot.querySelectorAll('button,input,textarea').forEach(el => el.disabled = false);
        if (status) status.classList.add('bad');
      }
    } finally {
      importBusy = false;
      activeUploadHandle = null;
    }
  }

  root.addEventListener('click', event => {
    const button = event.target?.closest?.('#importReview,#importDirect');
    if (!button) return;
    event.preventDefault();
